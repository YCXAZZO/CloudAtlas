<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudAtlas · 云岫集 — 个人云彩图鉴</title>

    <!-- SwiperJS 11 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js">
    </script>
    <!-- SortableJS 1.15 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js">
    </script>
    <!-- Supabase JS SDK v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <style>
        /* ============================================================
           CSS 变量 · 毛玻璃通透风 · 支持深色/浅色主题
           ============================================================ */
        :root {
            /* 深色模式（默认） */
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-bg-strong: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-shadow: rgba(0, 0, 0, 0.3);
            --glass-blur: 24px;

            --text-primary: #f0f4f8;
            --text-secondary: #b8c4d0;
            --text-muted: #7a8a9a;
            --text-accent: #a8d8ff;

            --accent: #7ec8f0;
            --accent-glow: rgba(126, 200, 240, 0.35);
            --accent-warm: #f0c8a0;
            --danger: #f0a0a0;
            --success: #a0f0b0;

            --bg-gradient-1: #0a0e1a;
            --bg-gradient-2: #141c30;
            --bg-gradient-3: #1a2438;

            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;

            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: 0.2s ease;

            --font-sans: 'Inter', 'PingFang SC', 'HarmonyOS Sans', 'Microsoft YaHei', -apple-system, sans-serif;
            --font-serif: 'Georgia', 'Noto Serif SC', 'Songti SC', serif;

            --nav-height: 68px;
            --panel-width: 300px;
            --thumbs-height: 110px;
        }

        /* 浅色模式变量 */
        [data-theme="light"] {
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-bg-strong: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(0, 0, 0, 0.12);
            --glass-shadow: rgba(0, 0, 0, 0.08);

            --text-primary: #1e2a3a;
            --text-secondary: #3a4a5a;
            --text-muted: #7a8a9a;
            --text-accent: #2a6a9a;

            --accent: #3a8ab8;
            --accent-glow: rgba(58, 138, 184, 0.2);
            --accent-warm: #c89560;
            --danger: #c05050;
            --success: #50a060;

            --bg-gradient-1: #e8eef5;
            --bg-gradient-2: #d5e0ea;
            --bg-gradient-3: #c8d5e2;
        }

        /* ============================================================
           全局重置
           ============================================================ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: var(--font-sans);
            background: linear-gradient(165deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 45%, var(--bg-gradient-3) 100%);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 云朵背景装饰 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 600px 350px at 15% 15%, rgba(126, 200, 240, 0.08) 0%, transparent 70%),
                radial-gradient(ellipse 500px 300px at 80% 20%, rgba(200, 170, 240, 0.06) 0%, transparent 70%),
                radial-gradient(ellipse 700px 400px at 50% 85%, rgba(126, 200, 240, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* 隐藏滚动条但可滚动 */
        .scrollable {
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(128, 128, 128, 0.25) transparent;
        }
        .scrollable::-webkit-scrollbar {
            width: 4px;
        }
        .scrollable::-webkit-scrollbar-track {
            background: transparent;
        }
        .scrollable::-webkit-scrollbar-thumb {
            background: rgba(128, 128, 128, 0.25);
            border-radius: 4px;
        }

        /* ============================================================
           毛玻璃组件基类
           ============================================================ */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            box-shadow:
                0 8px 32px var(--glass-shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .glass-strong {
            background: var(--glass-bg-strong);
            backdrop-filter: blur(var(--glass-blur)) saturate(1.6);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.6);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            box-shadow:
                0 12px 40px var(--glass-shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .glass-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 8px 16px;
            cursor: pointer;
            transition: var(--transition-fast);
            font-size: 13px;
            font-family: var(--font-sans);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .glass-btn:hover {
            background: var(--glass-bg-strong);
            border-color: var(--glass-border);
            transform: translateY(-1px);
        }
        .glass-btn:active {
            transform: translateY(0);
            opacity: 0.8;
        }
        .glass-btn.primary {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--text-primary);
            font-weight: 500;
        }
        .glass-btn.primary:hover {
            background: var(--accent-glow);
            border-color: var(--accent);
            opacity: 0.9;
        }
        .glass-btn.danger {
            border-color: rgba(240, 100, 100, 0.4);
            color: var(--danger);
        }
        .glass-btn.icon-btn {
            padding: 8px 10px;
            border-radius: 50%;
            font-size: 16px;
            line-height: 1;
            width: 36px;
            height: 36px;
            justify-content: center;
        }

        /* ============================================================
           应用整体布局
           ============================================================ */
        #app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* ---- 顶部导航栏 ---- */
        #top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: var(--nav-height);
            padding: 0 20px;
            flex-shrink: 0;
            z-index: 50;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border-bottom: 1px solid var(--glass-border);
        }

        #top-bar .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        #top-bar .logo:hover {
            opacity: 0.85;
        }
        #top-bar .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            flex-shrink: 0;
        }
        #top-bar .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        #top-bar .logo-text {
            font-family: var(--font-serif);
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }
        #top-bar .logo-sub {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-top: 2px;
        }

        #top-bar .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ---- 主内容区 ---- */
        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            gap: 12px;
            padding: 12px;
            min-height: 0;
        }

        /* ---- 左侧分类面板 ---- */
        #class-panel {
            width: var(--panel-width);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: var(--transition);
            min-height: 0;
        }
        #class-panel.collapsed {
            width: 0;
            opacity: 0;
            pointer-events: none;
            margin-right: 0;
        }
        #class-panel .panel-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        #class-panel .panel-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        #class-panel .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            min-height: 0;
        }

        /* 分类树 */
        .taxonomy-tree {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .taxonomy-group {
            margin-bottom: 8px;
        }
        .taxonomy-group-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 8px 6px 4px;
            cursor: pointer;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .taxonomy-group-label:hover {
            color: var(--text-accent);
        }
        .taxonomy-group-label .arrow {
            transition: var(--transition-fast);
            font-size: 10px;
            display: inline-block;
        }
        .taxonomy-group-label .arrow.open {
            transform: rotate(90deg);
        }
        .taxonomy-children {
            display: flex;
            flex-direction: column;
            gap: 1px;
            padding-left: 12px;
        }
        .taxonomy-children.collapsed {
            display: none;
        }
        .taxonomy-item {
            padding: 7px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
            position: relative;
        }
        .taxonomy-item:hover {
            background: var(--glass-bg-strong);
            color: var(--text-primary);
        }
        .taxonomy-item.active {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--text-primary);
            font-weight: 500;
        }
        .taxonomy-item .count-badge {
            font-size: 10px;
            background: var(--glass-bg);
            border-radius: 10px;
            padding: 2px 8px;
            margin-left: auto;
            color: var(--text-muted);
        }
        .taxonomy-item.active .count-badge {
            background: var(--glass-bg-strong);
            color: var(--text-primary);
        }
        .taxonomy-item .color-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ---- 中间画廊区 ---- */
        #gallery-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
            min-height: 0;
            position: relative;
        }

        /* Swiper 主图 */
        .main-swiper {
            flex: 1;
            width: 100%;
            min-height: 0;
            border-radius: var(--radius-lg);
            overflow: hidden;
            position: relative;
        }
        .main-swiper .swiper-slide {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-bg);
            position: relative;
            cursor: grab;
        }
        .main-swiper .swiper-slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: var(--radius-sm);
            user-select: none;
            -webkit-user-drag: none;
            transition: transform 0.3s ease;
        }
        .main-swiper .swiper-slide:hover img {
            transform: scale(1.01);
        }
        .slide-overlay {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg-strong);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 8px 18px;
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            pointer-events: none;
            white-space: nowrap;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid var(--glass-border);
        }
        .empty-gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 16px;
            color: var(--text-muted);
            font-size: 15px;
        }
        .empty-gallery .empty-icon {
            font-size: 64px;
            opacity: 0.5;
            animation: floatCloud 3s ease-in-out infinite;
        }
        @keyframes floatCloud {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* 缩略图条 */
        #thumbs-bar {
            height: var(--thumbs-height);
            flex-shrink: 0;
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            position: relative;
        }
        #thumbs-bar .thumbs-swiper {
            flex: 1;
            height: 100%;
            min-width: 0;
        }
        #thumbs-bar .thumbs-swiper .swiper-slide {
            width: 80px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition-fast);
            opacity: 0.6;
            background: var(--glass-bg);
        }
        #thumbs-bar .thumbs-swiper .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: calc(var(--radius-sm) - 2px);
            pointer-events: none;
            -webkit-user-drag: none;
        }
        #thumbs-bar .thumbs-swiper .swiper-slide-thumb-active {
            border-color: var(--accent);
            opacity: 1;
            box-shadow: 0 0 16px var(--accent-glow);
        }
        #thumbs-bar .thumbs-swiper .swiper-slide:hover {
            opacity: 0.9;
        }
        .thumb-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font-size: 32px;
            color: var(--text-muted);
            background: var(--glass-bg);
        }

        /* ---- 右侧详情面板 ---- */
        #detail-panel {
            width: 320px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: var(--transition);
            min-height: 0;
        }
        #detail-panel.collapsed {
            width: 0;
            opacity: 0;
            pointer-events: none;
            margin-left: 0;
        }
        #detail-panel .panel-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        #detail-panel .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            min-height: 0;
        }
        .detail-section {
            margin-bottom: 20px;
        }
        .detail-section h4 {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .detail-field {
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .detail-field .label {
            color: var(--text-muted);
            font-size: 12px;
            min-width: 60px;
        }
        .tag-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            margin: 2px;
            transition: var(--transition-fast);
            cursor: pointer;
        }
        .tag-badge:hover {
            background: var(--glass-bg-strong);
            color: var(--text-primary);
        }
        .tag-badge.active {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--text-primary);
        }

        /* ---- 模态框 ---- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: var(--glass-bg-strong);
            backdrop-filter: blur(30px) saturate(1.5);
            -webkit-backdrop-filter: blur(30px) saturate(1.5);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 28px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
            transform: translateY(20px) scale(0.96);
            transition: var(--transition);
        }
        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }
        .modal-content h3 {
            font-family: var(--font-serif);
            font-size: 22px;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }
        .modal-content .form-group {
            margin-bottom: 14px;
        }
        .modal-content .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .modal-content .form-group input,
        .modal-content .form-group select,
        .modal-content .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font-sans);
            outline: none;
            transition: var(--transition-fast);
        }
        .modal-content .form-group input:focus,
        .modal-content .form-group select:focus,
        .modal-content .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }
        .modal-content .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .modal-content .form-group select option {
            background: var(--bg-gradient-2);
            color: var(--text-primary);
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        /* ---- 全屏沉浸模式 ---- */
        #fullscreen-mode {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #fullscreen-mode.active {
            opacity: 1;
            pointer-events: auto;
        }
        #fullscreen-mode .fs-swiper {
            width: 100vw;
            height: 100vh;
        }
        #fullscreen-mode .fs-swiper .swiper-slide {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        #fullscreen-mode .fs-swiper .swiper-slide img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }
        #fs-controls {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 210;
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 10px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        #fs-controls .fs-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-fast);
        }
        #fs-controls .fs-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }
        #fs-controls .fs-counter {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            min-width: 50px;
            text-align: center;
        }
        #fs-close {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 215;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-fast);
        }
        #fs-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        /* ---- 密码保护模态框 ---- */
        #password-modal .modal-content {
            max-width: 400px;
            text-align: center;
        }
        #password-modal .password-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        #password-modal .password-input-wrap input {
            padding-right: 44px;
        }
        #password-modal .password-input-wrap .toggle-pass {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 6px;
        }

        /* ---- Toast 通知 ---- */
        #toast-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: var(--glass-bg-strong);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 12px 18px;
            font-size: 13px;
            color: var(--text-primary);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
            max-width: 300px;
            pointer-events: auto;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes toastOut {
            to {
                opacity: 0;
                transform: translateX(30px);
            }
        }

        /* ---- BGM 播放器 ---- */
        #bgm-widget {
            position: fixed;
            bottom: 16px;
            left: 16px;
            z-index: 60;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--glass-bg-strong);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 6px 14px 6px 8px;
            transition: var(--transition);
            cursor: pointer;
        }
        #bgm-widget:hover {
            background: var(--glass-bg-strong);
        }
        #bgm-widget .bgm-icon {
            font-size: 18px;
            animation: bgmPulse 2s ease-in-out infinite;
        }
        #bgm-widget .bgm-icon.paused {
            animation: none;
            opacity: 0.6;
        }
        @keyframes bgmPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }
        #bgm-widget .bgm-text {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ---- 响应式 ---- */
        @media (max-width: 1024px) {
            :root {
                --panel-width: 240px;
            }
            #detail-panel {
                width: 260px;
            }
        }
        @media (max-width: 768px) {
            #class-panel {
                position: fixed;
                top: var(--nav-height);
                left: 0;
                bottom: 0;
                z-index: 80;
                transform: translateX(-100%);
                width: 280px;
                border-radius: 0 var(--radius-md) var(--radius-md) 0;
            }
            #class-panel.mobile-open {
                transform: translateX(0);
            }
            #detail-panel {
                position: fixed;
                top: var(--nav-height);
                right: 0;
                bottom: 0;
                z-index: 80;
                transform: translateX(100%);
                width: 300px;
                border-radius: var(--radius-md) 0 0 var(--radius-md);
            }
            #detail-panel.mobile-open {
                transform: translateX(0);
            }
            #main-container {
                padding: 8px;
                gap: 8px;
            }
            :root {
                --nav-height: 56px;
                --thumbs-height: 80px;
            }
            .logo-text {
                font-size: 16px;
            }
            #top-bar {
                padding: 0 12px;
            }
        }

        /* ---- 图片上传拖拽区 ---- */
        #drop-zone {
            position: fixed;
            inset: 0;
            z-index: 150;
            background: var(--accent-glow);
            backdrop-filter: blur(4px);
            border: 3px dashed var(--accent);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--text-accent);
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
            margin: 20px;
        }
        #drop-zone.active {
            opacity: 1;
            pointer-events: auto;
        }
        #drop-zone .drop-inner {
            text-align: center;
            font-size: 16px;
            letter-spacing: 1px;
        }
        #drop-zone .drop-inner .big-icon {
            font-size: 56px;
            display: block;
            margin-bottom: 12px;
        }

        /* ---- 照片计数统计条 ---- */
        #stats-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 16px;
            font-size: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        #stats-bar .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #stats-bar .stat-num {
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* ---- 搜索框 ---- */
        #search-input {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 8px 16px;
            color: var(--text-primary);
            font-size: 13px;
            width: 180px;
            outline: none;
            transition: var(--transition);
            font-family: var(--font-sans);
        }
        #search-input::placeholder {
            color: var(--text-muted);
        }
        #search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
            width: 220px;
        }

        /* 主题切换按钮样式 */
        .theme-toggle-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: var(--transition-fast);
            color: var(--text-primary);
        }
        .theme-toggle-btn:hover {
            background: var(--glass-bg-strong);
            transform: rotate(20deg);
        }
    </style>
</head>
<body>

    <!-- ============================================================
    应用根元素
    ============================================================ -->
    <div id="app">
        <!-- 顶部导航栏 -->
        <header id="top-bar">
            <div class="logo" id="logo-btn" title="CloudAtlas · 云岫集">
                <div class="logo-icon" id="logo-icon-container">
                    <img id="logo-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23a8d8ff' opacity='0.6'/%3E%3Cpath d='M30,65 Q40,45 50,65 Q60,45 70,65 Z' fill='%23ffffff'/%3E%3C/svg%3E" alt="CloudAtlas Logo">
                </div>
                <div>
                    <div class="logo-text">CloudAtlas</div>
                    <div class="logo-sub">云 岫 集</div>
                </div>
            </div>
            <div class="nav-actions">
                <input type="text" id="search-input" placeholder="搜索云彩..." autocomplete="off">
                <button class="glass-btn" id="btn-toggle-class" title="切换分类面板">📂 分类</button>
                <button class="glass-btn" id="btn-toggle-detail" title="切换详情面板">📋 详情</button>
                <button class="glass-btn primary" id="btn-add-photo" title="添加云彩照片">＋ 添加</button>
                <button class="glass-btn" id="btn-fullscreen" title="沉浸式全屏展示">🖼️ 沉浸</button>
                <button class="theme-toggle-btn" id="btn-toggle-theme" title="切换深色/浅色模式">🌓</button>
                <button class="glass-btn icon-btn" id="btn-settings" title="设置">⚙️</button>
            </div>
        </header>

        <!-- 统计信息栏 -->
        <div id="stats-bar">
            <span class="stat-item">📷 共 <span class="stat-num" id="stat-total">0</span> 张</span>
            <span class="stat-item">☁️ <span class="stat-num" id="stat-families">0</span> 云族</span>
            <span class="stat-item">🌤️ <span class="stat-num" id="stat-genera">0</span> 云属</span>
            <span class="stat-item">🔍 筛选: <span id="stat-filter">全部</span></span>
        </div>

        <!-- 主内容区域 -->
        <div id="main-container">
            <!-- 左侧分类面板 -->
            <aside id="class-panel" class="glass">
                <div class="panel-header">
                    <span class="panel-title">☁️ 气象分类</span>
                    <button class="glass-btn icon-btn" id="btn-close-class" title="收起">✕</button>
                </div>
                <div class="panel-body scrollable" id="taxonomy-container">
                    <!-- 分类树由 JS 动态构建 -->
                </div>
            </aside>

            <!-- 中间画廊容器 -->
            <div id="gallery-container">
                <!-- 主图 Swiper -->
                <div class="main-swiper swiper" id="main-swiper">
                    <div class="swiper-wrapper" id="main-swiper-wrapper">
                        <!-- 动态幻灯片 -->
                    </div>
                    <div class="swiper-pagination"></div>
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                </div>
                <!-- 缩略图条 -->
                <div id="thumbs-bar" class="glass">
                    <div class="thumbs-swiper swiper" id="thumbs-swiper">
                        <div class="swiper-wrapper" id="thumbs-swiper-wrapper">
                            <!-- 动态缩略图 -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧详情面板 -->
            <aside id="detail-panel" class="glass">
                <div class="panel-header">
                    <span class="panel-title">📋 云彩详情</span>
                    <button class="glass-btn icon-btn" id="btn-close-detail" title="收起">✕</button>
                </div>
                <div class="panel-body scrollable" id="detail-body">
                    <!-- 详情由 JS 动态填充 -->
                </div>
            </aside>
        </div>
    </div>

    <!-- 全屏沉浸模式 -->
    <div id="fullscreen-mode">
        <div class="fs-swiper swiper" id="fs-swiper">
            <div class="swiper-wrapper" id="fs-swiper-wrapper"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
        </div>
        <button id="fs-close" title="退出全屏">✕</button>
        <div id="fs-controls">
            <button class="fs-btn" id="fs-prev">◀</button>
            <span class="fs-counter" id="fs-counter">0 / 0</span>
            <button class="fs-btn" id="fs-next">▶</button>
            <button class="fs-btn" id="fs-play" title="自动播放">▶️</button>
            <button class="fs-btn" id="fs-bgm" title="背景音乐">🎵</button>
        </div>
    </div>

    <!-- 密码保护模态框 -->
    <div class="modal-overlay" id="password-modal">
        <div class="modal-content">
            <h3>🔐 身份验证</h3>
            <p style="color:var(--text-secondary);font-size:14px;margin-bottom:16px;">
                进入编辑模式需要密码验证
            </p>
            <div class="form-group">
                <div class="password-input-wrap">
                    <input type="password" id="password-input" placeholder="请输入密码" autocomplete="off">
                    <button class="toggle-pass" id="toggle-pass-vis">👁️</button>
                </div>
            </div>
            <div class="modal-actions">
                <button class="glass-btn" id="btn-pass-cancel">取消</button>
                <button class="glass-btn primary" id="btn-pass-confirm">验证</button>
            </div>
        </div>
    </div>

    <!-- 添加/编辑照片模态框 -->

            <h3 id="edit-modal-title">📷 添加云彩照片</h3>

            <div class="form-group">
                <label>照片文件（可多选）</label>

            </div>

                <label>云族（Cloud Family）</label>
                <select id="edit-family"></select>
            </div>
            <div class="form-group">
                <label>云属（Cloud Genus）</label>
                <select id="edit-genus"></select>
            </div>
            <div class="form-group">
                <label>云种（Cloud Species）</label>
                <select id="edit-species"><option value="">— 选择 —</option></select>
            </div>
            <div class="form-group">
                <label>变种（Variety）</label>
                <select id="edit-variety"><option value="">— 选择 —</option></select>
            </div>
            <div class="form-group">

                <button class="glass-btn" id="btn-set-password" style="margin-top:6px;">设置/更新密码</button>
            </div>
            <div class="form-group">
                <label>Logo 图片 URL（外部链接）</label>
                <input type="url" id="settings-logo-url" placeholder="https://example.com/logo.png">
                <button class="glass-btn" id="btn-save-logo" style="margin-top:6px;">保存 Logo</button>
            </div>
            <div class="form-group">
                <label>BGM 音乐 URL（可选，Cloudflare R2 链接）</label>

            <div class="form-group">
                <label>R2 存储接口配置（用于照片云存储）</label>

            <div class="form-group">
                <label>Supabase 配置（可选，用于云端元数据同步）</label>

            <div class="form-group">
                <label>自定义气象分类（JSON 格式，可覆盖默认分类）</label>
                <textarea id="settings-taxonomy-json" rows="6" style="font-family:monospace;font-size:12px;"></textarea>
                <button class="glass-btn" id="btn-save-taxonomy" style="margin-top:6px;">保存自定义分类</button>
                <button class="glass-btn" id="btn-reset-taxonomy" style="margin-top:6px;margin-left:6px;">恢复默认</button>
            </div>
            <div class="form-group">
                <label>当前数据模式</label>
                <div id="settings-data-mode" style="font-size:13px;color:var(--text-secondary);">本地模式（IndexedDB）</div>
            </div>
            <div class="modal-actions">
                <button class="glass-btn" id="btn-settings-close">关闭</button>
                <button class="glass-btn danger" id="btn-clear-data">清空所有数据</button>
            </div>
        </div>
    </div>

    <!-- 拖拽上传区域 -->
    <div id="drop-zone">
        <div class="drop-inner">
            <span class="big-icon">📤</span>

            <small style="font-size:12px;color:var(--text-muted);">支持 JPG/PNG/WebP 格式</small>
        </div>
    </div>

    <!-- Toast 容器 -->

    <!-- BGM 播放器控件 -->
    <div id="bgm-widget" title="背景音乐">
        <span class="bgm-icon paused" id="bgm-icon">🎵</span>
        <span class="bgm-text" id="bgm-text">BGM 关闭</span>
    </div>

    <!-- 隐藏的 BGM 音频元素 -->
    <audio id="bgm-audio" loop style="display:none;"></audio>

            // ============================================================

            let db = null;

            function initIDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(IDB_NAME, IDB_VERSION);
                    request.onupgradeneeded = (e) => {
                        const d = e.target.result;
                        if (!d.objectStoreNames.contains(IDB_STORE_PHOTOS)) {
                            const store = d.createObjectStore(IDB_STORE_PHOTOS, { keyPath: 'id' });
                            store.createIndex('family', 'family', { unique: false });
                            store.createIndex('genus', 'genus', { unique: false });
                        }
                        if (!d.objectStoreNames.contains(IDB_STORE_IMAGES)) {
                            d.createObjectStore(IDB_STORE_IMAGES, { keyPath: 'id' });
                        }
                        if (!d.objectStoreNames.contains(IDB_STORE_META)) {
                            d.createObjectStore(IDB_STORE_META, { keyPath: 'key' });
                        }
                    };
                    request.onsuccess = (e) => {
                        db = e.target.result;
                        resolve(db);
                    };
                    request.onerror = (e) => {
                        console.error('IndexedDB 初始化失败:', e);
                        if (window.location.protocol === 'file:') {
                            showToast('检测到 file:// 协议，IndexedDB 不可用，请使用 HTTP 服务器打开', 'error');
                        }
                        reject(e);
                    };
                });
            }

            function idbAdd(storeName, data) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    store.put(data);
                    tx.oncomplete = () => resolve(data);
                    tx.onerror = (e) => reject(e);
                });
            }

            function idbGet(storeName, key) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const req = store.get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = (e) => reject(e);
                });
            }

            function idbGetAll(storeName) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = (e) => reject(e);
                });
            }

            function idbDelete(storeName, key) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    store.delete(key);
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = (e) => reject(e);
                });
            }

            function idbClear(storeName) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    store.clear();
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = (e) => reject(e);
                });
            }

            function generateId() {

            function hashPassword(pwd) {
                let hash = 0;
                const str = 'cloudatlas_salt_' + pwd;
                for (let i = 0; i < str.length; i++) {
                    const char = str.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash;
                }
                return 'h_' + Math.abs(hash).toString(36) + '_' + str.length.toString(36);
            }

            function verifyPassword(input) {
                const stored = localStorage.getItem(LS_PASSWORD) || '';
                if (!stored) return true;
                return hashPassword(input) === stored;
            }

            function isPasswordSet() {

            }

            function setPassword(pwd) {

            function getFamilyName(familyId) {
                const fam = TAXONOMY.families.find(f => f.id === familyId);
                return fam ? fam.name : familyId;
            }

            function getGenusName(genusId) {
                const gen = ALL_GENERA.find(g => g.id === genusId);
                return gen ? gen.name : genusId;
            }

            function getFamilyByGenus(genusId) {
                const gen = ALL_GENERA.find(g => g.id === genusId);
                return gen ? gen.family : '';

            function getGenusAbbr(genusId) {

            function getPhotoById(id) {
                return state.photos.find(p => p.id === id) || null;
            }

            function getSortedPhotos() {
                if (state.sortOrder.length > 0) {
                    const orderMap = new Map(state.sortOrder.map((id, i) => [id, i]));
                    return [...state.photos].sort((a, b) => {
                        const oa = orderMap.has(a.id) ? orderMap.get(a.id) : Infinity;
                        const ob = orderMap.has(b.id) ? orderMap.get(b.id) : Infinity;
                        if (oa !== ob) return oa - ob;
                        return (b.createdAt || 0) - (a.createdAt || 0);
                    });
                }
                return [...state.photos].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            }

            function getFilteredPhotos() {
                const sorted = getSortedPhotos();
                const filter = state.currentFilter;
                const searchTerm = dom.searchInput.value.trim().toLowerCase();
                if (filter.type === 'all' && !searchTerm) return sorted;
                return sorted.filter(p => {
                    let matchFilter = true;
                    if (filter.type === 'family') matchFilter = p.family === filter.value;
                    else if (filter.type === 'genus') matchFilter = p.genus === filter.value;
                    else if (filter.type === 'species') matchFilter = p.species === filter.value;
                    else if (filter.type === 'variety') matchFilter = p.variety === filter.value;
                    else if (filter.type === 'feature') matchFilter = p.feature === filter.value;
                    if (!matchFilter) return false;
                    if (searchTerm) {
                        const searchStr = [
                            p.description || '',
                            p.location || '',
                            p.family || '',
                            p.genus || '',
                            p.species || '',
                            p.variety || '',
                            p.feature || '',
                            getFamilyName(p.family),
                            getGenusName(p.genus)
                        ].join(' ').toLowerCase();
                        return searchStr.includes(searchTerm);
                    }
                    return true;
                });
            }

            async function loadAllData() {
                try {
                    const photos = await idbGetAll(IDB_STORE_PHOTOS);
                    state.photos = photos || [];

                    const imageRecords = await idbGetAll(IDB_STORE_IMAGES);
                    imageRecords.forEach(rec => {
                        if (rec && rec.id && rec.blob) {
                            state.imageBlobs[rec.id] = URL.createObjectURL(rec.blob);
                        }
                    });

                    const sortOrderMeta = await idbGet(IDB_STORE_META, 'sortOrder');
                    if (sortOrderMeta && Array.isArray(sortOrderMeta.value)) {
                        state.sortOrder = sortOrderMeta.value;
                    }

                    const validIds = new Set(state.photos.map(p => p.id));
                    state.sortOrder = state.sortOrder.filter(id => validIds.has(id));
                } catch (err) {
                    console.error('加载数据失败:', err);

                await idbDelete(IDB_STORE_PHOTOS, id);

                if (state.imageBlobs[id]) {

                state.photos = state.photos.filter(p => p.id !== id);
                state.sortOrder = state.sortOrder.filter(sid => sid !== id);
                await saveSortOrder();

            // ============================================================
            // 图片处理与上传
            // ============================================================
            async function processImageFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const maxThumbSize = 200;
                            const ratio = Math.min(maxThumbSize / img.width, maxThumbSize / img.height, 1);
                            const canvas = document.createElement('canvas');
                            canvas.width = Math.round(img.width * ratio);
                            canvas.height = Math.round(img.height * ratio);
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            canvas.toBlob((thumbBlob) => {
                                fetch(e.target.result).then(r => r.blob()).then(originalBlob => {
                                    resolve({
                                        originalBlob: originalBlob,
                                        thumbBlob: thumbBlob || originalBlob,
                                        width: img.width,
                                        height: img.height,
                                        fileName: file.name,
                                        fileSize: file.size,
                                    });
                                }).catch(reject);
                            }, 'image/jpeg', 0.7);
                        };
                        img.onerror = reject;
                        img.src = e.target.result;
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

            async function uploadToR2IfConfigured(photoData, originalBlob) {
                if (!state.r2Endpoint) return null; // 未配置R2，直接返回null
                try {
                    const formData = new FormData();
                    formData.append('file', originalBlob, photoData.fileName || 'cloud.jpg');
                    formData.append('photoId', photoData.id);
                    if (state.r2Bucket) formData.append('bucket', state.r2Bucket);
                    // 可以添加其他元数据
                    formData.append('description', photoData.description || '');
                    formData.append('location', photoData.location || '');

                    const response = await fetch(state.r2Endpoint, {
                        method: 'POST',
                        body: formData,
                    });
                    if (response.ok) {
                        const result = await response.json();
                        return result.url || result.publicUrl || null;
                    } else {
                        console.warn('R2 上传失败，状态码:', response.status);
                        return null;
                    }
                } catch (err) {
                    console.warn('R2 上传异常:', err);
                    return null;
                }
            }

            async function addPhotosFromFiles(files) {
                if (!files || files.length === 0) return;
                for (const file of files) {
                    if (!file.type.startsWith('image/')) {
                        showToast(`跳过非图片文件: ${file.name}`, 'error');
                        continue;
                    }
                    try {
                        const processed = await processImageFile(file);
                        const photoId = generateId();
                        const photoData = {
                            id: photoId,
                            family: '',
                            genus: '',
                            species: '',
                            variety: '',
                            feature: '',
                            description: '',
                            location: '',
                            photoDate: '',
                            fileName: processed.fileName,
                            fileSize: processed.fileSize,
                            width: processed.width,
                            height: processed.height,
                            createdAt: Date.now(),
                            r2Url: null, // 初始为null
                        };

                        // 尝试上传到R2（如果配置）
                        const r2Url = await uploadToR2IfConfigured(photoData, processed.originalBlob);
                        if (r2Url) {
                            photoData.r2Url = r2Url;
                            showToast(`照片已上传到R2: ${file.name}`, 'success');
                        }

                        // 仍然存储在IndexedDB作为本地缓存
                        await idbAdd(IDB_STORE_IMAGES, { id: photoId, blob: processed.originalBlob });
                        state.imageBlobs[photoId] = URL.createObjectURL(processed.originalBlob);
                        await savePhoto(photoData);
                        state.photos.push(photoData);
                        state.sortOrder.push(photoId);

                        if (!r2Url) {
                            showToast(`已添加（本地存储）: ${file.name}`, 'success');
                        }
                    } catch (err) {
                        console.error('处理图片失败:', err);
                        showToast(`图片处理失败: ${file.name}`, 'error');
                    }
                }
                await saveSortOrder();
                refreshUI();
            }

            function buildTaxonomyTree() {
                const container = dom.taxonomyContainer;
                container.innerHTML = '';

                const allGroup = document.createElement('div');

                allLabel.innerHTML = '<span class="arrow open">▶</span> 📷 全部照片';
                allLabel.style.color = 'var(--text-secondary)';
                allLabel.style.fontWeight = '500';
                allLabel.addEventListener('click', () => setFilter('all', null));
                if (state.currentFilter.type === 'all') allLabel.style.color = 'var(--accent)';
                allGroup.appendChild(allLabel);
                tree.appendChild(allGroup);

                TAXONOMY.families.forEach(family => {
                    const group = document.createElement('div');
                    group.className = 'taxonomy-group';

                    const label = document.createElement('div');
                    label.className = 'taxonomy-group-label';
                    const isFamilyActive = state.currentFilter.type === 'family' && state.currentFilter
                        .value === family.id;
                    label.innerHTML =
                        `<span class="arrow ${isFamilyActive ? 'open' : ''}">▶</span> <span class="color-dot" style="background:${family.color};"></span> ${family.name} <small style="font-weight:400;color:var(--text-muted);">${family.altitude || ''}</small>`;
                    label.style.color = isFamilyActive ? 'var(--accent)' : 'var(--text-secondary)';
                    label.addEventListener('click', () => {
                        const children = group.querySelector('.taxonomy-children');
                        if (children) {
                            children.classList.toggle('collapsed');
                            const arrow = label.querySelector('.arrow');
                            if (arrow) arrow.classList.toggle('open');
                        }
                    });

                    const childrenDiv = document.createElement('div');
                    childrenDiv.className = 'taxonomy-children';
                    if (!isFamilyActive) childrenDiv.classList.add('collapsed');

                    const familyFilterItem = document.createElement('div');
                    familyFilterItem.className = 'taxonomy-item' + (isFamilyActive ? ' active' : '');
                    familyFilterItem.innerHTML =
                        `<span>📂 全部${family.name}</span><span class="count-badge">${countByFamily(family.id)}</span>`;
                    familyFilterItem.addEventListener('click', (e) => {
                        e.stopPropagation();
                        setFilter('family', family.id);
                    });
                    childrenDiv.appendChild(familyFilterItem);

                    const generaOfFamily = TAXONOMY.genera[family.id] || [];
                    generaOfFamily.forEach(genus => {
                        const genusItem = document.createElement('div');
                        const isGenusActive = state.currentFilter.type === 'genus' && state
                            .currentFilter.value === genus.id;
                        genusItem.className = 'taxonomy-item' + (isGenusActive ? ' active' : '');
                        genusItem.innerHTML =
                            `<span class="color-dot" style="background:${genus.color};"></span> ${genus.name} (${genus.abbr}) <span class="count-badge">${countByGenus(genus.id)}</span>`;
                        genusItem.addEventListener('click', (e) => {
                            e.stopPropagation();
                            setFilter('genus', genus.id);
                        });
                        childrenDiv.appendChild(genusItem);
                    });

                    group.appendChild(label);
                    group.appendChild(childrenDiv);
                    tree.appendChild(group);
                });

                // 变种和附属云单独分组
                const varGroup = document.createElement('div');
                varGroup.className = 'taxonomy-group';
                const varLabel = document.createElement('div');
                varLabel.className = 'taxonomy-group-label';
                varLabel.innerHTML = '<span class="arrow">▶</span> 🌈 变种 (Varieties)';
                varLabel.addEventListener('click', () => {
                    const children = varGroup.querySelector('.taxonomy-children');
                    if (children) {
                        children.classList.toggle('collapsed');
                        varLabel.querySelector('.arrow')?.classList.toggle('open');
                    }
                });
                const varChildren = document.createElement('div');
                varChildren.className = 'taxonomy-children collapsed';
                (TAXONOMY.varieties || []).forEach(v => {
                    if (v === ' —') return;
                    const item = document.createElement('div');
                    const isActive = state.currentFilter.type === 'variety' && state.currentFilter.value ===
                        v;
                    item.className = 'taxonomy-item' + (isActive ? ' active' : '');
                    item.innerHTML = `<span>${v}</span><span class="count-badge">${countByVariety(v)}</span>`;
                    item.addEventListener('click', () => setFilter('variety', v));
                    varChildren.appendChild(item);
                });
                varGroup.appendChild(varLabel);
                varGroup.appendChild(varChildren);
                tree.appendChild(varGroup);

                const featGroup = document.createElement('div');
                featGroup.className = 'taxonomy-group';
                const featLabel = document.createElement('div');
                featLabel.className = 'taxonomy-group-label';
                featLabel.innerHTML = '<span class="arrow">▶</span> ✨ 附属云 (Features)';
                featLabel.addEventListener('click', () => {
                    const children = featGroup.querySelector('.taxonomy-children');
                    if (children) {
                        children.classList.toggle('collapsed');
                        featLabel.querySelector('.arrow')?.classList.toggle('open');
                    }
                });
                const featChildren = document.createElement('div');
                featChildren.className = 'taxonomy-children collapsed';
                (TAXONOMY.features || []).forEach(f => {
                    if (f === ' —') return;
                    const item = document.createElement('div');
                    const isActive = state.currentFilter.type === 'feature' && state.currentFilter.value ===
                        f;
                    item.className = 'taxonomy-item' + (isActive ? ' active' : '');
                    item.innerHTML = `<span>${f}</span><span class="count-badge">${countByFeature(f)}</span>`;
                    item.addEventListener('click', () => setFilter('feature', f));
                    featChildren.appendChild(item);
                });
                featGroup.appendChild(featLabel);
                featGroup.appendChild(featChildren);
                tree.appendChild(featGroup);

                container.appendChild(tree);
            }

            function countByFamily(familyId) {
                return state.photos.filter(p => p.family === familyId).length;
            }

            function countByGenus(genusId) {
                return state.photos.filter(p => p.genus === genusId).length;
            }

            function countByVariety(variety) {
                return state.photos.filter(p => p.variety === variety).length;
            }

            function countByFeature(feature) {
                return state.photos.filter(p => p.feature === feature).length;
            }

            function setFilter(type, value) {
                state.currentFilter = { type, value };
                refreshUI();
            }

            // ============================================================
            // Swiper 初始化与更新
            // ============================================================
            let mainSwiper = null;
            let thumbsSwiper = null;
            let fsSwiper = null;

            function initSwipers() {
                if (thumbsSwiper) thumbsSwiper.destroy(true, true);
                thumbsSwiper = new Swiper(dom.thumbsSwiperEl, {
                    slidesPerView: 'auto',
                    spaceBetween: 6,
                    freeMode: true,
                    watchSlidesProgress: true,
                    breakpoints: {
                        0: { slidesPerView: 4, spaceBetween: 4 },
                        600: { slidesPerView: 6, spaceBetween: 6 },
                        900: { slidesPerView: 8, spaceBetween: 8 },
                        1200: { slidesPerView: 10, spaceBetween: 8 },
                        1600: { slidesPerView: 12, spaceBetween: 8 },
                    }
                });

                if (mainSwiper) mainSwiper.destroy(true, true);
                mainSwiper = new Swiper(dom.mainSwiperEl, {
                    slidesPerView: 1,
                    spaceBetween: 0,
                    loop: false,
                    navigation: {
                        nextEl: dom.mainSwiperEl.querySelector('.swiper-button-next'),
                        prevEl: dom.mainSwiperEl.querySelector('.swiper-button-prev'),
                    },
                    pagination: {
                        el: dom.mainSwiperEl.querySelector('.swiper-pagination'),
                        clickable: true,
                    },
                    thumbs: {
                        swiper: thumbsSwiper,
                    },
                    keyboard: { enabled: true },
                    on: {
                        slideChange: function() {
                            state.currentIndex = this.activeIndex;
                            updateDetailPanel();
                        }
                    }
                });

                if (fsSwiper) fsSwiper.destroy(true, true);
                fsSwiper = new Swiper(dom.fsSwiperEl, {
                    slidesPerView: 1,
                    spaceBetween: 0,
                    loop: false,
                    navigation: {
                        nextEl: dom.fsSwiperEl.querySelector('.swiper-button-next'),
                        prevEl: dom.fsSwiperEl.querySelector('.swiper-button-prev'),
                    },
                    keyboard: { enabled: true },
                    on: {
                        slideChange: function() {
                            updateFsCounter();
                        }
                    }
                });
            }

            function updateSwipers() {
                const filtered = getFilteredPhotos();
                const mainWrapper = dom.mainSwiperWrapper;
                const thumbsWrapper = dom.thumbsSwiperWrapper;
                const fsWrapper = dom.fsSwiperWrapper;

                mainWrapper.innerHTML = '';
                thumbsWrapper.innerHTML = '';
                fsWrapper.innerHTML = '';

                if (filtered.length === 0) {
                    const emptySlide = document.createElement('div');
                    emptySlide.className = 'swiper-slide';
                    emptySlide.innerHTML = `
                        <div class="empty-gallery">
                            <span class="empty-icon">☁️</span>
                            <div>暂无云彩照片</div>
                            <button class="glass-btn primary" onclick="document.getElementById('btn-add-photo').click()">＋ 添加第一张照片</button>
                        </div>
                    `;
                    mainWrapper.appendChild(emptySlide);
                    dom.statsTotal.textContent = '0';
                    dom.statsFamilies.textContent = '0';
                    dom.statsGenera.textContent = '0';
                    dom.statsFilter.textContent = '全部';
                    if (mainSwiper) mainSwiper.update();
                    if (thumbsSwiper) thumbsSwiper.update();
                    if (fsSwiper) fsSwiper.update();
                    updateDetailPanel();
                    updateStats();
                    return;
                }

                filtered.forEach((photo, index) => {
                    const blobUrl = state.imageBlobs[photo.id] || photo.r2Url;

                    const mainSlide = document.createElement('div');
                    mainSlide.className = 'swiper-slide';
                    if (blobUrl) {
                        mainSlide.innerHTML = `
                            <img src="${blobUrl}" alt="${photo.description || photo.fileName || '云彩'}" loading="lazy">
                            <div class="slide-overlay">${getGenusName(photo.genus) || '未分类'} · ${photo.location || '未知地点'} · ${formatDate(photo.photoDate)}</div>
                        `;
                    } else {
                        mainSlide.innerHTML = `<div class="empty-gallery"><span class="empty-icon">🖼️</span><div>图片数据缺失</div></div>`;
                    }
                    mainWrapper.appendChild(mainSlide);

                    const thumbSlide = document.createElement('div');
                    thumbSlide.className = 'swiper-slide';
                    thumbSlide.setAttribute('data-photo-id', photo.id);
                    if (blobUrl) {
                        thumbSlide.innerHTML = `<img src="${blobUrl}" alt="thumb" loading="lazy">`;
                    } else {
                        thumbSlide.innerHTML = `<div class="thumb-placeholder">☁️</div>`;
                    }
                    thumbsWrapper.appendChild(thumbSlide);

                    const fsSlide = document.createElement('div');
                    fsSlide.className = 'swiper-slide';
                    if (blobUrl) {
                        fsSlide.innerHTML = `<img src="${blobUrl}" alt="fullscreen" loading="lazy">`;
                    }
                    fsWrapper.appendChild(fsSlide);
                });

                if (mainSwiper) mainSwiper.update();
                if (thumbsSwiper) thumbsSwiper.update();
                if (fsSwiper) fsSwiper.update();

                updateStats();
                updateDetailPanel();
                updateFsCounter();
            }

            function updateStats() {
                const filtered = getFilteredPhotos();
                const families = new Set(filtered.map(p => p.family).filter(Boolean));
                const genera = new Set(filtered.map(p => p.genus).filter(Boolean));
                dom.statsTotal.textContent = filtered.length;
                dom.statsFamilies.textContent = families.size;
                dom.statsGenera.textContent = genera.size;
                dom.statsFilter.textContent = getFilterLabel();
            }

            function getFilterLabel() {
                const f = state.currentFilter;
                if (f.type === 'all') return '全部';
                if (f.type === 'family') return '云族: ' + getFamilyName(f.value);
                if (f.type === 'genus') return '云属: ' + getGenusName(f.value);
                if (f.type === 'species') return '云种: ' + f.value;
                if (f.type === 'variety') return '变种: ' + f.value;
                if (f.type === 'feature') return '附属云: ' + f.value;
                return '全部';
            }

                            <button class="glass-btn" id="btn-detail-fullscreen" data-photo-id="${photo.id}">🖼️ 全屏</button>

                const editBtn = dom.detailBody.querySelector('#btn-edit-photo');
                if (editBtn) editBtn.addEventListener('click', () => openEditModal(photo.id));

                if (fsBtn) fsBtn.addEventListener('click', () => openFullscreen(photo.id));
