            function updateFsCounter() {
                if (!fsSwiper) return;
                const filtered = getFilteredPhotos();
                const idx = fsSwiper.activeIndex;
                dom.fsCounter.textContent = `${idx + 1} / ${filtered.length}`;
            }

            // ============================================================
            // 刷新 UI
            // ============================================================
            function refreshUI() {
                buildTaxonomyTree();
                updateSwipers();
                updateStats();
            }

            // ============================================================
            // 模态框管理
            // ============================================================
            function showModal(modal) {
                modal.classList.add('active');
            }

            function hideModal(modal) {
                modal.classList.remove('active');
            }

            // ============================================================
            // 密码验证
            // ============================================================
            function requestPassword(callback) {
                if (state.isPasswordVerified) {
                    callback(true);
                    return;
                }
                if (!isPasswordSet()) {
                    state.isPasswordVerified = true;
                    callback(true);
                    return;
                }
                dom.passwordInput.value = '';
                showModal(dom.passwordModal);
                const confirmHandler = () => {
                    if (verifyPassword(dom.passwordInput.value)) {
                        state.isPasswordVerified = true;
                        hideModal(dom.passwordModal);
                        callback(true);
                    } else {
                        showToast('密码错误，请重试', 'error');
                        dom.passwordInput.value = '';
                        dom.passwordInput.focus();
                    }
                };
                const cancelHandler = () => {
                    hideModal(dom.passwordModal);
                    callback(false);
                };
                dom.passwordInput.onkeydown = (e) => {
                    if (e.key === 'Enter') confirmHandler();
                    if (e.key === 'Escape') cancelHandler();
                };
                document.getElementById('btn-pass-confirm').onclick = confirmHandler;
                document.getElementById('btn-pass-cancel').onclick = cancelHandler;
                setTimeout(() => dom.passwordInput.focus(), 200);
            }

            // ============================================================
            // 编辑模态框
            // ============================================================
            function populateTaxonomySelects() {
                dom.editFamily.innerHTML = '<option value="">— 选择云族 —</option>';
                TAXONOMY.families.forEach(f => {
                    dom.editFamily.innerHTML += `<option value="${f.id}">${f.name}</option>`;
                });

                updateGenusSelect();
                updateSpeciesSelect();

                dom.editVariety.innerHTML = '<option value="">— 选择 —</option>';
                (TAXONOMY.varieties || []).forEach(v => {
                    if (v !== ' —') dom.editVariety.innerHTML += `<option value="${v}">${v}</option>`;
                    else dom.editVariety.innerHTML += `<option value="">—</option>`;
                });

                dom.editFeature.innerHTML = '<option value="">— 选择 —</option>';
                (TAXONOMY.features || []).forEach(f => {
                    if (f !== ' —') dom.editFeature.innerHTML += `<option value="${f}">${f}</option>`;
                    else dom.editFeature.innerHTML += `<option value="">—</option>`;
                });
            }

            function updateGenusSelect() {
                const familyId = dom.editFamily.value;
                dom.editGenus.innerHTML = '<option value="">— 选择云属 —</option>';
                if (familyId && TAXONOMY.genera[familyId]) {
                    TAXONOMY.genera[familyId].forEach(g => {
                        dom.editGenus.innerHTML +=
                            `<option value="${g.id}">${g.name} (${g.abbr})</option>`;
                    });
                } else if (!familyId) {
                    ALL_GENERA.forEach(g => {
                        dom.editGenus.innerHTML +=
                            `<option value="${g.id}">${g.name} (${g.abbr})</option>`;
                    });
                }
                updateSpeciesSelect();
            }

            function updateSpeciesSelect() {
                const genusId = dom.editGenus.value;
                dom.editSpecies.innerHTML = '<option value="">— 选择 —</option>';
                if (genusId && TAXONOMY.species[genusId]) {
                    TAXONOMY.species[genusId].forEach(s => {
                        if (s !== '—') dom.editSpecies.innerHTML += `<option value="${s}">${s}</option>`;
                        else dom.editSpecies.innerHTML += `<option value="">—</option>`;
                    });
                }
            }

            function openEditModal(photoId = null) {
                requestPassword((verified) => {
                    if (!verified) return;
                    state.editingPhotoId = photoId;
                    state.selectedFiles = [];
                    dom.selectedFilesPreview.innerHTML = '';
                    dom.editModalTitle.textContent = photoId ? '✏️ 编辑云彩信息' : '📷 添加云彩照片';

                    if (photoId) {
                        const photo = getPhotoById(photoId);
                        if (photo) {
                            dom.editFamily.value = photo.family || '';
                            updateGenusSelect();
                            dom.editGenus.value = photo.genus || '';
                            updateSpeciesSelect();
                            dom.editSpecies.value = photo.species || '';
                            dom.editVariety.value = photo.variety || '';
                            dom.editFeature.value = photo.feature || '';
                            dom.editDescription.value = photo.description || '';
                            dom.editLocation.value = photo.location || '';
                            dom.editDate.value = photo.photoDate || '';
                        }
                        dom.btnSelectFiles.style.display = 'none';
                    } else {
                        dom.editFamily.value = '';
                        updateGenusSelect();
                        dom.editGenus.value = '';
                        updateSpeciesSelect();
                        dom.editSpecies.value = '';
                        dom.editVariety.value = '';
                        dom.editFeature.value = '';
                        dom.editDescription.value = '';
                        dom.editLocation.value = '';
                        dom.editDate.value = '';
                        dom.btnSelectFiles.style.display = 'block';
                    }
                    showModal(dom.editModal);
                });
            }

            function closeEditModal() {
                hideModal(dom.editModal);
                state.editingPhotoId = null;
                state.selectedFiles = [];
                dom.selectedFilesPreview.innerHTML = '';
            }

            async function saveEditModal() {
                const family = dom.editFamily.value;
                const genus = dom.editGenus.value;
                const species = dom.editSpecies.value;
                const variety = dom.editVariety.value;
                const feature = dom.editFeature.value;
                const description = dom.editDescription.value.trim();
                const location = dom.editLocation.value.trim();
                const photoDate = dom.editDate.value;

                if (state.editingPhotoId) {
                    const photo = getPhotoById(state.editingPhotoId);
                    if (photo) {
                        photo.family = family;
                        photo.genus = genus;
                        photo.species = species;
                        photo.variety = variety;
                        photo.feature = feature;
                        photo.description = description;
                        photo.location = location;
                        photo.photoDate = photoDate;
                        await savePhoto(photo);
                        showToast('照片信息已更新', 'success');
                    }
                } else if (state.selectedFiles.length > 0) {
                    for (const file of state.selectedFiles) {
                        try {
                            const processed = await processImageFile(file);
                            const photoId = generateId();
                            const photoData = {
                                id: photoId,
                                family,
                                genus,
                                species,
                                variety,
                                feature,
                                description,
                                location,
                                photoDate,
                                fileName: processed.fileName,
                                fileSize: processed.fileSize,
                                width: processed.width,
                                height: processed.height,
                                createdAt: Date.now(),
                                r2Url: null,
                            };

                            const r2Url = await uploadToR2IfConfigured(photoData, processed.originalBlob);
                            if (r2Url) photoData.r2Url = r2Url;

                            await idbAdd(IDB_STORE_IMAGES, { id: photoId, blob: processed
                                    .originalBlob });
                            state.imageBlobs[photoId] = URL.createObjectURL(processed.originalBlob);
                            await savePhoto(photoData);
                            state.photos.push(photoData);
                            state.sortOrder.push(photoId);
                        } catch (err) {
                            console.error('处理图片失败:', err);
                            showToast(`图片处理失败: ${file.name}`, 'error');
                        }
                    }
                    await saveSortOrder();
                    showToast(`已添加 ${state.selectedFiles.length} 张照片`, 'success');
                } else {
                    showToast('请选择照片文件', 'error');
                    return;
                }

                closeEditModal();
                refreshUI();
            }

            async function deletePhoto(photoId) {
                requestPassword((verified) => {
                    if (!verified) return;
                    if (confirm('确定要删除这张照片吗？此操作不可撤销。')) {
                        deletePhotoFromDB(photoId).then(() => {
                            showToast('照片已删除', 'success');
                            refreshUI();
                        });
                    }
                });
            }

            // ============================================================
            // 全屏沉浸模式
            // ============================================================
            function openFullscreen(photoId = null) {
                const filtered = getFilteredPhotos();
                if (filtered.length === 0) {
                    showToast('没有照片可展示', 'error');
                    return;
                }
                let startIndex = 0;
                if (photoId) {
                    const idx = filtered.findIndex(p => p.id === photoId);
                    if (idx >= 0) startIndex = idx;
                }
                state.isFullscreen = true;
                dom.fullscreenMode.classList.add('active');
                if (fsSwiper) {
                    fsSwiper.slideTo(startIndex, 0);
                    updateFsCounter();
                }
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                }
            }

            function closeFullscreen() {
                state.isFullscreen = false;
                dom.fullscreenMode.classList.remove('active');
                if (state.fsAutoPlay) toggleFsAutoPlay(false);
                if (document.fullscreenElement && document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                }
            }

            function toggleFsAutoPlay(forceState = null) {
                const newState = forceState !== null ? forceState : !state.fsAutoPlay;
                state.fsAutoPlay = newState;
                if (state.fsAutoPlay) {
                    state.fsAutoPlayTimer = setInterval(() => {
                        if (fsSwiper && state.isFullscreen) {
                            fsSwiper.slideNext();
                        }
                    }, 4000);
                    dom.fsPlay.textContent = '⏸️';
                    dom.fsPlay.style.background = 'rgba(126,200,240,0.3)';
                } else {
                    if (state.fsAutoPlayTimer) {
                        clearInterval(state.fsAutoPlayTimer);
                        state.fsAutoPlayTimer = null;
                    }
                    dom.fsPlay.textContent = '▶️';
                    dom.fsPlay.style.background = '';
                }
            }

            // ============================================================
            // BGM 播放器
            // ============================================================
            function initBgm() {
                const savedUrl = localStorage.getItem(LS_BGM_URL) || '';
                state.bgmUrl = savedUrl;
                if (savedUrl) {
                    dom.bgmAudio.src = savedUrl;
                    dom.bgmText.textContent = 'BGM 就绪';
                }
                dom.bgmWidget.addEventListener('click', () => {
                    toggleBgm();
                });
                dom.fsBgm.addEventListener('click', () => {
                    toggleBgm();
                });
            }

            function toggleBgm() {
                if (!state.bgmUrl) {
                    showToast('请在设置中配置BGM音乐URL', 'info');
                    return;
                }
                if (state.bgmPlaying) {
                    dom.bgmAudio.pause();
                    state.bgmPlaying = false;
                    dom.bgmIcon.classList.add('paused');
                    dom.bgmText.textContent = 'BGM 暂停';
                    dom.fsBgm.textContent = '🎵';
                } else {
                    dom.bgmAudio.play().then(() => {
                        state.bgmPlaying = true;
                        dom.bgmIcon.classList.remove('paused');
                        dom.bgmText.textContent = 'BGM 播放中';
                        dom.fsBgm.textContent = '🔊';
                    }).catch(() => {
                        showToast('BGM 播放失败，请检查URL', 'error');
                    });
                }
            }

            // ============================================================
            // 设置
            // ============================================================
            function openSettings() {
                dom.settingsPassword.value = '';
                dom.settingsBgmUrl.value = localStorage.getItem(LS_BGM_URL) || '';
                dom.settingsSupabaseUrl.value = localStorage.getItem(LS_SUPABASE_URL) || '';
                dom.settingsSupabaseKey.value = localStorage.getItem(LS_SUPABASE_KEY) || '';
                dom.settingsLogoUrl.value = localStorage.getItem(LS_LOGO_URL) || '';
                dom.settingsTaxonomyJson.value = localStorage.getItem(LS_TAXONOMY_CUSTOM) || JSON.stringify(
                    DEFAULT_TAXONOMY, null, 2);
                dom.settingsR2Endpoint.value = state.r2Endpoint || '';
                dom.settingsR2Bucket.value = state.r2Bucket || '';
                dom.settingsDataMode.textContent = state.supabase ? '云端模式（Supabase已连接）' :
                    '本地模式（IndexedDB）';
                showModal(dom.settingsModal);
            }

            function closeSettings() {
                hideModal(dom.settingsModal);
            }

            // ============================================================
            // Supabase 集成（可选）
            // ============================================================
            function initSupabase() {
                const url = localStorage.getItem(LS_SUPABASE_URL);
                const key = localStorage.getItem(LS_SUPABASE_KEY);
                if (url && key && window.supabase) {
                    try {
                        state.supabase = window.supabase.createClient(url, key);
                        dom.settingsDataMode.textContent = '云端模式（Supabase已连接）';
                        return true;
                    } catch (e) {
                        console.error('Supabase 初始化失败:', e);
                    }
                }
                dom.settingsDataMode.textContent = '本地模式（IndexedDB）';
                return false;
            }

            async function syncToSupabase() {
                if (!state.supabase) return;
                try {
                    const { data, error } = await state.supabase.from('cloud_photos').select('*');
                    if (error) throw error;
                    console.log('Supabase 同步完成，云端照片数:', data?.length || 0);
                    showToast(`Supabase 云端有 ${data?.length || 0} 条记录`, 'info');
                } catch (e) {
                    console.error('Supabase 同步失败:', e);
                    showToast('Supabase 同步失败，请检查配置', 'error');
                }
            }

            // ============================================================
            // 拖拽排序初始化
            // ============================================================
            function initSortable() {
                const thumbsWrapper = dom.thumbsSwiperWrapper;
                if (!thumbsWrapper) return;

                const sortable = new Sortable(thumbsWrapper, {
                    animation: 200,
                    delay: 200,
                    delayOnTouchOnly: true,
                    draggable: '.swiper-slide',
                    ghostClass: 'sortable-ghost',
                    chosenClass: 'sortable-chosen',
                    dragClass: 'sortable-drag',
                    onEnd: async (evt) => {
                        const filtered = getFilteredPhotos();
                        const oldIndex = evt.oldIndex;
                        const newIndex = evt.newIndex;
                        if (oldIndex === newIndex || oldIndex === undefined || newIndex === undefined)
                            return;

                        const photoId = filtered[oldIndex]?.id;
                        if (!photoId) return;

                        const currentSorted = getSortedPhotos().map(p => p.id);
                        const currentIdx = currentSorted.indexOf(photoId);
                        if (currentIdx === -1) return;

                        const [moved] = currentSorted.splice(currentIdx, 1);
                        const targetIdx = newIndex < filtered.length ? newIndex : filtered.length - 1;
                        currentSorted.splice(targetIdx, 0, moved);

                        state.sortOrder = currentSorted;
                        await saveSortOrder();
                        refreshUI();
                        showToast('排序已更新', 'success');
                    }
                });
            }

            // ============================================================
            // 事件绑定
            // ============================================================
            function bindEvents() {
                // Logo 点击
                dom.logoBtn = $('#logo-btn');
                dom.logoBtn.addEventListener('click', () => {
                    setFilter('all', null);
                });

                // 主题切换
                dom.themeToggleBtn.addEventListener('click', () => {
                    const current = document.documentElement.getAttribute('data-theme');
                    const next = current === 'dark' ? 'light' : 'dark';
                    applyTheme(next);
                    dom.themeToggleBtn.textContent = next === 'dark' ? '☀️' : '🌙';
                    showToast(`已切换到${next === 'dark' ? '深色' : '浅色'}模式`, 'success');
                });

                // 分类面板切换
                $('#btn-toggle-class').addEventListener('click', () => {
                    if (window.innerWidth <= 768) {
                        dom.classPanel.classList.toggle('mobile-open');
                    } else {
                        dom.classPanel.classList.toggle('collapsed');
                    }
                });
                $('#btn-close-class').addEventListener('click', () => {
                    if (window.innerWidth <= 768) {
                        dom.classPanel.classList.remove('mobile-open');
                    } else {
                        dom.classPanel.classList.add('collapsed');
                    }
                });

                // 详情面板切换
                $('#btn-toggle-detail').addEventListener('click', () => {
                    if (window.innerWidth <= 768) {
                        dom.detailPanel.classList.toggle('mobile-open');
                    } else {
                        dom.detailPanel.classList.toggle('collapsed');
                    }
                });
                $('#btn-close-detail').addEventListener('click', () => {
                    if (window.innerWidth <= 768) {
                        dom.detailPanel.classList.remove('mobile-open');
                    } else {
                        dom.detailPanel.classList.add('collapsed');
                    }
                });

                // 添加照片
                $('#btn-add-photo').addEventListener('click', () => {
                    openEditModal(null);
                });

                // 文件选择
                $('#btn-select-files').addEventListener('click', () => {
                    dom.photoFileInput.click();
                });
                dom.photoFileInput.addEventListener('change', (e) => {
                    if (e.target.files && e.target.files.length > 0) {
                        state.selectedFiles = Array.from(e.target.files);
                        updateSelectedFilesPreview();
                    }
                });

                // 拖拽上传
                let dragCounter = 0;
                document.addEventListener('dragenter', (e) => {
                    e.preventDefault();
                    dragCounter++;
                    if (dragCounter > 0 && !state.isFullscreen) dom.dropZone.classList.add('active');
                });
                document.addEventListener('dragleave', (e) => {
                    e.preventDefault();
                    dragCounter--;
                    if (dragCounter <= 0) dom.dropZone.classList.remove('active');
                });
                document.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });
                document.addEventListener('drop', (e) => {
                    e.preventDefault();
                    dragCounter = 0;
                    dom.dropZone.classList.remove('active');
                    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                        const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith(
                            'image/'));
                        if (files.length > 0) {
                            requestPassword((verified) => {
                                if (verified) {
                                    addPhotosFromFiles(files);
                                }
                            });
                        }
                    }
                });

                // 搜索
                dom.searchInput.addEventListener('input', () => {
                    refreshUI();
                });

                // 编辑模态框分类联动
                dom.editFamily.addEventListener('change', updateGenusSelect);
                dom.editGenus.addEventListener('change', updateSpeciesSelect);

                // 编辑保存/取消
                $('#btn-edit-save').addEventListener('click', saveEditModal);
                $('#btn-edit-cancel').addEventListener('click', closeEditModal);

                // 设置相关
                $('#btn-settings').addEventListener('click', openSettings);
                $('#btn-settings-close').addEventListener('click', closeSettings);
                $('#btn-set-password').addEventListener('click', () => {
                    const pwd = dom.settingsPassword.value.trim();
                    if (pwd) {
                        setPassword(pwd);
                        showToast('密码已设置', 'success');
                    } else {
                        setPassword('');
                        showToast('密码已清除', 'info');
                    }
                    dom.settingsPassword.value = '';
                });
                $('#btn-save-logo').addEventListener('click', () => {
                    const url = dom.settingsLogoUrl.value.trim();
                    if (url) {
                        localStorage.setItem(LS_LOGO_URL, url);
                        applyLogo(url);
                        showToast('Logo 已更新', 'success');
                    } else {
                        localStorage.removeItem(LS_LOGO_URL);
                        applyLogo('');
                        showToast('已恢复默认Logo', 'info');
                    }
                });
                $('#btn-save-taxonomy').addEventListener('click', () => {
                    const json = dom.settingsTaxonomyJson.value.trim();
                    if (json) {
                        saveCustomTaxonomy(json);
                    } else {
                        resetTaxonomy();
                    }
                });
                $('#btn-reset-taxonomy').addEventListener('click', () => {
                    resetTaxonomy();
                });
                $('#btn-clear-data').addEventListener('click', () => {
                    requestPassword((verified) => {
                        if (!verified) return;
                        if (confirm('确定要清空所有数据吗？此操作不可撤销！')) {
                            clearAllData().then(() => {
                                showToast('所有数据已清空', 'success');
                                closeSettings();
                                refreshUI();
                            });
                        }
                    });
                });

                // BGM URL 变更
                dom.settingsBgmUrl.addEventListener('change', () => {
                    const url = dom.settingsBgmUrl.value.trim();
                    if (url) {
                        localStorage.setItem(LS_BGM_URL, url);
                        state.bgmUrl = url;
                        dom.bgmAudio.src = url;
                        dom.bgmText.textContent = 'BGM 就绪';
                    } else {
                        localStorage.removeItem(LS_BGM_URL);
                        state.bgmUrl = '';
                        dom.bgmText.textContent = 'BGM 关闭';
                    }
                    showToast('BGM 设置已保存', 'success');
                });

                // Supabase 配置
                dom.settingsSupabaseUrl.addEventListener('change', () => {
                    const url = dom.settingsSupabaseUrl.value.trim();
                    if (url) localStorage.setItem(LS_SUPABASE_URL, url);
                    else localStorage.removeItem(LS_SUPABASE_URL);
                });
                dom.settingsSupabaseKey.addEventListener('change', () => {
                    const key = dom.settingsSupabaseKey.value.trim();
                    if (key) localStorage.setItem(LS_SUPABASE_KEY, key);
                    else localStorage.removeItem(LS_SUPABASE_KEY);
                    initSupabase();
                });

                // R2 配置保存
                dom.settingsR2Endpoint.addEventListener('change', saveR2Config);
                dom.settingsR2Bucket.addEventListener('change', saveR2Config);

                // 密码可见性切换
                dom.togglePassVis.addEventListener('click', () => {
                    const input = dom.passwordInput;
                    if (input.type === 'password') {
                        input.type = 'text';
                        dom.togglePassVis.textContent = '🙈';
                    } else {
                        input.type = 'password';
                        dom.togglePassVis.textContent = '👁️';
                    }
                });

                // 全屏
                $('#btn-fullscreen').addEventListener('click', () => {
                    openFullscreen();
                });
                dom.fsClose.addEventListener('click', closeFullscreen);
                dom.fsPrev.addEventListener('click', () => {
                    if (fsSwiper) fsSwiper.slidePrev();
                });
                dom.fsNext.addEventListener('click', () => {
                    if (fsSwiper) fsSwiper.slideNext();
                });
                dom.fsPlay.addEventListener('click', () => toggleFsAutoPlay());
                dom.fsBgm.addEventListener('click', () => toggleBgm());
                document.addEventListener('keydown', (e) => {
                    if (state.isFullscreen) {
                        if (e.key === 'Escape') closeFullscreen();
                        if (e.key === 'ArrowLeft' && fsSwiper) fsSwiper.slidePrev();
                        if (e.key === 'ArrowRight' && fsSwiper) fsSwiper.slideNext();
                        if (e.key === ' ') {
                            e.preventDefault();
                            toggleFsAutoPlay();
                        }
                    }
                    if (e.key === 'Escape' && dom.editModal.classList.contains('active')) {
                        closeEditModal();
                    }
                    if (e.key === 'Escape' && dom.settingsModal.classList.contains('active')) {
                        closeSettings();
                    }
                });

                // 模态框点击外部关闭
                dom.passwordModal.addEventListener('click', (e) => {
                    if (e.target === dom.passwordModal) hideModal(dom.passwordModal);
                });
                dom.editModal.addEventListener('click', (e) => {
                    if (e.target === dom.editModal) closeEditModal();
                });
                dom.settingsModal.addEventListener('click', (e) => {
                    if (e.target === dom.settingsModal) closeSettings();
                });

                // 响应式调整
                window.addEventListener('resize', () => {
                    if (window.innerWidth > 768) {
                        dom.classPanel.classList.remove('mobile-open');
                        dom.detailPanel.classList.remove('mobile-open');
                    }
                    if (mainSwiper) mainSwiper.update();
                    if (thumbsSwiper) thumbsSwiper.update();
                    if (fsSwiper) fsSwiper.update();
                });
            }

            function updateSelectedFilesPreview() {
                const container = dom.selectedFilesPreview;
                container.innerHTML = '';
                state.selectedFiles.forEach((file, idx) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const div = document.createElement('div');
                        div.style.cssText =
                            'width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--glass-bg);flex-shrink:0;position:relative;';
                        div.innerHTML = `
                            <img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;">
                            <span style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.7);color:#fff;font-size:9px;padding:2px 4px;border-radius:4px;">${idx + 1}</span>
                        `;
                        container.appendChild(div);
                    };
                    reader.readAsDataURL(file);
                });
                if (state.selectedFiles.length > 0) {
                    dom.btnSelectFiles.innerHTML =
                        `📁 已选 ${state.selectedFiles.length} 张照片（点击更换）`;
                } else {
                    dom.btnSelectFiles.innerHTML = '📁 点击选择照片';
                }
            }

            // ============================================================
            // 初始化应用
            // ============================================================
            async function initApp() {
                try {
                    // 初始化主题
                    initTheme();
                    // 初始化Logo
                    initLogo();
                    // 加载自定义分类
                    loadCustomTaxonomy();
                    // 加载R2配置
                    loadR2Config();

                    await initIDB();
                    await loadAllData();
                    initSwipers();
                    buildTaxonomyTree();
                    populateTaxonomySelects();
                    initBgm();
                    initSupabase();
                    bindEvents();
                    initSortable();
                    updateSwipers();
                    updateStats();

                    if (window.innerWidth <= 768) {
                        dom.classPanel.classList.add('collapsed');
                        dom.detailPanel.classList.add('collapsed');
                    }

                    console.log('☁️ CloudAtlas · 云岫集 初始化完成');
                    console.log(`📷 加载了 ${state.photos.length} 张照片`);
                } catch (err) {
                    console.error('应用初始化失败:', err);
                    showToast('应用初始化失败，请刷新页面重试', 'error');
                }
            }

            // 启动应用
            document.addEventListener('DOMContentLoaded', initApp);
            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                initApp();
            }

        })();
    </script>
</body>
</html>
