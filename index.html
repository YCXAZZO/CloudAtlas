<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudAtlas · 云岫集</title>
    <!-- SwiperJS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ========== 基础与重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-grad: linear-gradient(150deg, #e0f2fe 0%, #f3e8ff 55%, #fde7f3 100%);
            --sky-accent: #5b7cfa;
            --sky-accent-hover: #4656e8;
            --ink: #1e293b;
            --ink-soft: #64748b;
            --card-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.6);
            --card-border: rgba(148, 163, 184, 0.25);
            --navbar-bg: rgba(255, 255, 255, 0.5);
            --input-bg: rgba(255, 255, 255, 0.62);
            --modal-bg: rgba(255, 255, 255, 0.8);
            --modal-close-bg: rgba(255, 255, 255, 0.85);
            --hover-bg: rgba(91, 124, 250, 0.1);
            --placeholder-bg: rgba(226, 232, 240, 0.7);
            --tag-bg: linear-gradient(90deg, #eaf1ff, #f0ecff);
            --tag-color: #5a7bbf;
            --danger-bg: rgba(255, 120, 100, 0.14);
            --danger-color: #c0392b;
            --card-shadow: 0 8px 24px rgba(80, 100, 255, 0.08);
            --card-shadow-hover: 0 18px 36px rgba(80, 100, 255, 0.16);
            --radius: 16px;
        }

        /* 深色模式 */
        [data-theme="dark"] {
            --bg-grad: linear-gradient(150deg, #0a0e1a 0%, #14102a 55%, #1a1030 100%);
            --sky-accent: #6d8cff;
            --sky-accent-hover: #8299ff;
            --ink: #f1f5f9;
            --ink-soft: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.14);
            --card-border: rgba(255, 255, 255, 0.12);
            --navbar-bg: rgba(10, 14, 26, 0.55);
            --input-bg: rgba(255, 255, 255, 0.06);
            --modal-bg: rgba(20, 24, 40, 0.85);
            --modal-close-bg: rgba(0, 0, 0, 0.35);
            --hover-bg: rgba(255, 255, 255, 0.1);
            --placeholder-bg: rgba(255, 255, 255, 0.08);
            --tag-bg: rgba(120, 140, 255, 0.18);
            --tag-color: #b7c2ff;
            --danger-bg: rgba(255, 100, 100, 0.18);
            --danger-color: #ff8a80;
            --card-shadow: 0 20px 40px -12px rgba(80, 100, 255, 0.2);
            --card-shadow-hover: 0 24px 48px -12px rgba(80, 100, 255, 0.3);
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui,
                -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--ink);
            background: var(--bg-grad);
            background-attachment: fixed;
            min-height: 100vh;
            transition: background 0.4s ease, color 0.4s ease;
        }

        body.modal-open {
            overflow: hidden;
        }

        /* ========== 顶部导航栏 ========== */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            padding: 0 28px;
            background: var(--navbar-bg);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .site-logo {
            display: block;
            height: 90px;
            width: auto;
            object-fit: contain;
        }

        .site-logo-fallback {
            font-size: 17px;
            font-weight: 700;
            color: var(--ink);
            font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
            white-space: nowrap;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-divider {
            width: 1px;
            height: 26px;
            background: var(--card-border);
        }

        .btn-nav {
            padding: 7px 14px;
            font-size: 13px;
        }

        .nav-search {
            width: 190px;
            padding: 7px 14px;
            font-size: 13px;
            color: var(--ink);
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 999px;
            outline: none;
            font-family: inherit;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .nav-search:focus {
            border-color: var(--sky-accent);
            box-shadow: 0 0 0 3px rgba(74, 164, 232, 0.16);
        }

        .nav-search::placeholder {
            color: var(--ink-soft);
        }

        .nav-select {
            height: 34px;
            padding: 0 12px;
            font-size: 13px;
            color: var(--ink);
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 999px;
            outline: none;
            font-family: inherit;
            cursor: pointer;
            transition: border-color 0.15s ease;
        }

        .nav-select:focus {
            border-color: var(--sky-accent);
        }

        /* ========== 迁移提示 ========== */
        .migrate-toast {
            position: fixed;
            top: 84px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            background: rgba(43, 58, 74, 0.92);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            box-shadow: 0 8px 20px rgba(20, 40, 70, 0.3);
            pointer-events: none;
        }

        .migrate-toast[hidden] {
            display: none;
        }

        /* ========== 照片墙网格 ========== */
        .grid-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            padding: 32px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .photo-card {
            display: flex;
            flex-direction: column;
            height: 380px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .photo-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--card-shadow-hover);
        }

        .photo-media {
            flex: 0 0 80%;
            width: 100%;
            min-height: 0;
            overflow: hidden;
            background: linear-gradient(155deg, #9fd5ff, #d8ecff);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .photo-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            position: relative;
            z-index: 1;
            transition: opacity 0.4s ease;
        }

        .photo-media.loaded img {
            opacity: 1;
        }

        .media-skeleton {
            position: absolute;
            inset: 0;
            aspect-ratio: 4 / 3;
            pointer-events: none;
            background: linear-gradient(90deg, #eef1f5 25%, #f6f8fb 37%, #eef1f5 63%);
            background-size: 400% 100%;
            animation: shimmer 1.3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 100% 0;
            }

            100% {
                background-position: -100% 0;
            }
        }

        .photo-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef1f5;
            color: #94a3b8;
            font-size: 13px;
        }

        .photo-info {
            flex: 1 0 20%;
            min-width: 0;
            padding: 10px 14px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .photo-main {
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex: 1 1 auto;
            overflow: hidden;
        }

        .photo-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .photo-tag {
            display: inline-block;
            align-self: flex-start;
            margin-top: 6px;
            padding: 2px 9px;
            font-size: 11px;
            border-radius: 999px;
            background: var(--tag-bg);
            color: var(--tag-color);
            font-weight: 500;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .photo-edit {
            flex-shrink: 0;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--sky-accent);
            background: transparent;
            border: 1px solid var(--sky-accent);
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .photo-edit:hover {
            background: rgba(74, 164, 232, 0.12);
        }

        /* ========== 空状态 ========== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 62vh;
            gap: 16px;
            text-align: center;
            color: var(--ink-soft);
            padding: 32px;
        }

        .empty-state[hidden] {
            display: none;
        }

        .empty-state .empty-cloud {
            font-size: 64px;
            filter: drop-shadow(0 6px 12px rgba(74, 164, 232, 0.3));
        }

        .empty-state .empty-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--ink);
        }

        .empty-state .empty-hint {
            font-size: 14px;
        }

        /* ========== 通用按钮 ========== */
        .btn {
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background: var(--sky-accent);
            color: #fff;
            box-shadow: 0 6px 16px rgba(74, 164, 232, 0.35);
        }

        .btn-primary:hover {
            background: var(--sky-accent-hover);
        }

        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger-color);
            border: 1px solid var(--glass-border);
        }

        .btn-danger:hover {
            background: var(--hover-bg);
        }

        .btn-ai {
            background: linear-gradient(135deg, rgba(91, 124, 250, 0.18), rgba(180, 160, 255, 0.2));
            color: var(--sky-accent);
            border: 1px solid var(--glass-border);
        }

        .btn-ai:hover {
            background: linear-gradient(135deg, rgba(91, 124, 250, 0.28), rgba(180, 160, 255, 0.3));
        }

        .btn-ghost {
            background: transparent;
            color: var(--ink-soft);
            border: 1px solid var(--card-border);
        }

        .btn-ghost:hover {
            background: var(--hover-bg);
        }

        /* ========== 模态框通用 ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(43, 58, 74, 0.42);
            backdrop-filter: blur(4px);
        }

        .modal-overlay[hidden] {
            display: none;
        }

        .modal {
            position: relative;
            width: min(700px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: var(--modal-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(20, 40, 70, 0.35);
        }

        .modal::-webkit-scrollbar {
            width: 8px;
        }

        .modal::-webkit-scrollbar-thumb {
            background: rgba(74, 164, 232, 0.28);
            border-radius: 999px;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 14px;
            z-index: 2;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: var(--modal-close-bg);
            color: var(--ink-soft);
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            display: grid;
            place-items: center;
            box-shadow: 0 2px 8px rgba(20, 40, 70, 0.2);
            transition: background 0.15s ease, color 0.15s ease;
        }

        .modal-close:hover {
            background: #ffffff;
            color: var(--ink);
        }

        .modal-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 28px 26px;
            border-top: 1px solid var(--card-border);
        }

        .import-body {
            padding: 26px 28px 6px;
        }

        .import-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--ink);
        }

        .import-desc {
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.6;
            color: var(--ink-soft);
        }

        .app-footer {
            text-align: center;
            padding: 24px 20px 44px;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.7;
        }

        .app-footer .footer-name {
            font-size: 13px;
            color: #94a3b8;
        }

        .app-footer .footer-copy {
            margin-top: 4px;
            font-size: 12px;
            color: #a8b3c0;
        }

        .footer-link {
            margin-top: 12px;
            border: 1px solid var(--card-border);
            background: transparent;
            color: var(--ink-soft);
            font-size: 12px;
            padding: 5px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .footer-link:hover {
            background: #eef6fd;
            color: var(--sky-accent);
        }

        .modal-auth {
            width: min(440px, 100%);
        }

        .auth-body {
            padding: 26px 28px 10px;
        }

        .auth-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--ink);
            text-align: center;
        }

        .auth-input {
            width: 100%;
            margin-top: 12px;
            padding: 11px 14px;
            font-size: 14px;
            color: var(--ink);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            outline: none;
            background: var(--input-bg);
            font-family: inherit;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .auth-input:focus {
            border-color: var(--sky-accent);
            box-shadow: 0 0 0 3px rgba(74, 164, 232, 0.18);
        }

        .auth-input.shake {
            animation: shake 0.4s;
        }

        .auth-error {
            min-height: 18px;
            margin-top: 10px;
            font-size: 13px;
            color: #e0564c;
        }

        .auth-keep {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            font-size: 12px;
            color: var(--ink-soft);
            cursor: pointer;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-6px);
            }

            40% {
                transform: translateX(6px);
            }

            60% {
                transform: translateX(-4px);
            }

            80% {
                transform: translateX(4px);
            }
        }

        .modal-preview {
            width: min(900px, 100%);
            overflow-y: auto;
        }

        .preview-swiper-main {
            width: 100%;
            height: 400px;
            background: #fff;
            border-radius: 20px 20px 0 0;
            overflow: hidden;
        }

        .preview-swiper-main .swiper-slide {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f6fa;
        }

        .preview-swiper-main .swiper-slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .preview-slide-empty {
            font-size: 15px;
            color: #94a3b8;
            text-align: center;
        }

        .preview-swiper-main .swiper-button-next,
        .preview-swiper-main .swiper-button-prev {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(20, 40, 70, 0.55);
            color: #ffffff;
        }

        .preview-swiper-main .swiper-button-next::after,
        .preview-swiper-main .swiper-button-prev::after {
            font-size: 18px;
            font-weight: 700;
        }

        .preview-swiper-main .swiper-button-next:hover,
        .preview-swiper-main .swiper-button-prev:hover {
            background: rgba(20, 40, 70, 0.75);
        }

        .preview-swiper-main .swiper-pagination {
            position: absolute;
            bottom: 10px;
        }

        .preview-swiper-thumbs {
            background: #fff;
            padding: 12px 0 10px;
        }

        .preview-swiper-thumbs .swiper-slide {
            width: auto;
            height: 80px;
            opacity: 0.55;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .preview-swiper-thumbs .swiper-slide img {
            height: 80px;
            width: auto;
            display: block;
            object-fit: contain;
            background: #eef1f5;
            border-radius: 8px;
            border: 2px solid transparent;
            transition: border-color 0.2s ease;
        }

        .preview-swiper-thumbs .swiper-slide-thumb-active {
            opacity: 1;
        }

        .preview-swiper-thumbs .swiper-slide-thumb-active img {
            border-color: var(--sky-accent);
        }

        .preview-info {
            padding: 22px 28px 8px;
        }

        .preview-info h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--ink);
        }

        .preview-classify {
            margin-top: 10px;
            font-size: 13px;
            line-height: 1.7;
            color: var(--ink-soft);
            word-break: break-word;
        }

        .preview-notes {
            margin-top: 12px;
            margin-bottom: 12px;
            padding: 16px;
            background: #f5f7fa;
            border-radius: 8px;
            color: #334155;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .preview-notes.empty {
            color: #94a3b8;
        }

        .preview-fallback {
            display: none;
            width: 100%;
            max-height: 430px;
            overflow: hidden;
            background: #eef1f5;
            align-items: center;
            justify-content: center;
            border-radius: 20px 20px 0 0;
        }

        .preview-fallback img {
            max-width: 100%;
            max-height: 430px;
            object-fit: contain;
        }

        .preview-fallback .fallback-empty {
            padding: 90px 0;
            font-size: 14px;
            color: #94a3b8;
        }

        .edit-body {
            padding: 24px 28px 8px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
            color: var(--ink);
        }

        .field input[type="text"],
        .field textarea,
        .field select {
            width: 100%;
            padding: 10px 13px;
            font-size: 14px;
            color: var(--ink);
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            outline: none;
            font-family: inherit;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .field input[type="text"]:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: var(--sky-accent);
            box-shadow: 0 0 0 3px rgba(74, 164, 232, 0.18);
        }

        .field textarea {
            min-height: 140px;
            resize: vertical;
            line-height: 1.6;
        }

        .edit-media {
            width: 100%;
            height: 140px;
            border: 2px dashed var(--card-border);
            border-radius: 12px;
            background: var(--input-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .edit-media:hover {
            border-color: var(--sky-accent);
            background: var(--hover-bg);
        }

        .edit-media-empty {
            color: var(--ink-soft);
            font-size: 14px;
            text-align: center;
            line-height: 1.7;
        }

        .edit-thumbs {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 6px;
        }

        .edit-thumb {
            position: relative;
            flex: 0 0 auto;
            height: 80px;
            width: auto;
            max-width: 120px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            background: var(--placeholder-bg);
        }

        .edit-thumb img {
            display: block;
            height: 80px;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            object-position: center;
            background: var(--placeholder-bg);
        }

        .edit-thumb-remove {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 18px;
            height: 18px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            color: #ffffff;
            font-size: 11px;
            line-height: 1;
            cursor: pointer;
            display: grid;
            place-items: center;
        }

        .edit-thumb-remove:hover {
            background: rgba(0, 0, 0, 0.75);
        }

        .edit-thumbs .sortable-ghost {
            opacity: 0.4;
        }

        .edit-thumbs .sortable-chosen {
            box-shadow: 0 4px 12px rgba(74, 164, 232, 0.25);
        }

            // ==============================================================
            // 2. IndexedDB 基础封装（仅用于图片存储）
            // ==============================================================
            var _dbPromise = null;

            function openDB() {
                if (_dbPromise) return _dbPromise;
                _dbPromise = new Promise(function (resolve, reject) {
                    var req = indexedDB.open(DB_NAME, 2);
                    req.onupgradeneeded = function (e) {
                        var db = e.target.result;
                        if (!db.objectStoreNames.contains(CLOUDS_STORE)) {
                            db.createObjectStore(CLOUDS_STORE, {keyPath: "id"});
                        }
                        if (!db.objectStoreNames.contains(IMAGES_STORE)) {
                            db.createObjectStore(IMAGES_STORE, {autoIncrement: true});
                        }
                        if (!db.objectStoreNames.contains(CONFIG_STORE)) {
                            db.createObjectStore(CONFIG_STORE, {keyPath: "key"});
                        }
                    };
                    req.onsuccess = function (e) {
                        resolve(e.target.result);
                    };
                    req.onerror = function (e) {
                        reject(e.target.error);
                    };
                });
                return _dbPromise;
            }

            function idbImagePut(value) {
                return openDB().then(function (db) {
                    return new Promise(function (resolve, reject) {
                        var tx = db.transaction(IMAGES_STORE, "readwrite");
                        var store = tx.objectStore(IMAGES_STORE);
                        var req = store.put(value);
                        req.onsuccess = function () {
                            resolve(req.result);
                        };
                        req.onerror = function () {
                            reject(req.error);
                        };
                    });
                });
            }

            function idbImageGet(key) {
                return openDB().then(function (db) {
                    return new Promise(function (resolve, reject) {
                        var tx = db.transaction(IMAGES_STORE, "readonly");
                        var store = tx.objectStore(IMAGES_STORE);
                        var req = store.get(key);
                        req.onsuccess = function () {
                            resolve(req.result != null ? req.result : null);
                        };
                        req.onerror = function () {
                            reject(req.error);
                        };
                    });
                });
            }

            function idbImageDelete(key) {
                return openDB().then(function (db) {
                    return new Promise(function (resolve, reject) {
                        var tx = db.transaction(IMAGES_STORE, "readwrite");
                        var store = tx.objectStore(IMAGES_STORE);
                        var req = store.delete(key);
                        req.onsuccess = function () {
                            resolve(true);
                        };
                        req.onerror = function () {
                            reject(req.error);
                        };
                    });
                });
            }

                        if (!file || !file.type || file.type.indexOf("image/") !== 0) {
                            reject(new Error("仅支持图片文件"));

                        }
                        var reader = new FileReader();
                        reader.onload = function (e) {
                            var base64 = String(e.target.result);
                            idbImagePut(base64)
                                .then(function () {
                                    resolve(base64);
                                })
                                .catch(function () {
                                    resolve(base64);
                                });
                        };
                        reader.onerror = function () {
                            reject(reader.error || new Error("图片读取失败"));
                        };
                        reader.readAsDataURL(file);
                    });
                },
                get: function (idOrUrl) {
                    if (idOrUrl && idOrUrl.indexOf("data:") === 0) {
                        return Promise.resolve(idOrUrl);
                    }

            // SHA-256 哈希
            async function hashPassword(password) {
                const encoder = new TextEncoder();
                const data = encoder.encode(password);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            // 从 Supabase 获取密码哈希
            async function getCloudPasswordHash() {
                const {data, error} = await window.supabase
                    .from('app_config')
                    .select('value')
                    .eq('key', 'passwordHash')
                    .maybeSingle();
                if (error) {
                    console.error('获取密码失败:', error);
                    return null;
                }
                return data ? data.value : null;
            }

            // 将密码哈希存储到 Supabase
            async function setCloudPassword(plainPassword) {
                const hash = await hashPassword(plainPassword);
                const {error} = await window.supabase
                    .from('app_config')
                    .upsert({key: 'passwordHash', value: hash, updated_at: new Date().toISOString()});
                if (error) {
                    console.error('存储密码失败:', error);
                    throw error;
                }
                return hash;
            }

            // 检查是否存在密码
            async function hasPassword() {
                const hash = await getCloudPasswordHash();
                return hash !== null;
            }

            // 验证密码
            async function verifyPassword(input) {
                const storedHash = await getCloudPasswordHash();
                if (!storedHash) return false;
                const inputHash = await hashPassword(input);
                return inputHash === storedHash;
            }

            function genToken() {

            function isAuthed() {
                // 如果内存中无 token，尝试从 localStorage 恢复
                if (!authToken) {
                    var storedToken = localStorage.getItem('cloudatlas_auth_token');
                    var storedExpires = localStorage.getItem('cloudatlas_auth_expires');
                    if (storedToken && storedExpires) {
                        var expireNum = parseInt(storedExpires, 10);
                        if (Date.now() < expireNum) {
                            authToken = storedToken;
                            authExpiresAt = expireNum;
                        } else {
                            // 过期则清除
                            localStorage.removeItem('cloudatlas_auth_token');
                            localStorage.removeItem('cloudatlas_auth_expires');
                        }
                    }
                }
                return authToken !== null && Date.now() < authExpiresAt;
            }

                        var slide = document.createElement("div");
                        slide.className = "swiper-slide";
                        var img = document.createElement("img");

            function destroyPreviewSwiper() {
                if (previewInitTimer) {
                    clearTimeout(previewInitTimer);
                    previewInitTimer = null;
                }
                if (mainSwiper) {
                    mainSwiper.destroy(true, true);
                    mainSwiper = null;
                }
                if (thumbsSwiper) {
                    thumbsSwiper.destroy(true, true);
                    thumbsSwiper = null;
                }
            }

            function showPreviewFallback(images) {
                var fallback = document.getElementById("previewFallback");
                var mainEl = document.getElementById("previewSwiperMain");
                var thumbsEl = document.getElementById("previewSwiperThumbs");
                if (!fallback) return;
                if (mainEl) mainEl.style.display = "none";
                if (thumbsEl) thumbsEl.style.display = "none";
                fallback.style.display = "flex";
                fallback.innerHTML = "";
                var src = images && images[0];
                if (src) {
                    var img = document.createElement("img");
                    img.src = src;
                    img.alt = "云朵图片";
                    fallback.appendChild(img);
                } else {
                    var msg = document.createElement("div");
                    msg.className = "fallback-empty";
                    msg.textContent = "📷 暂无图片";
                    fallback.appendChild(msg);
                }
            }

            function hidePreviewFallback() {
                var fallback = document.getElementById("previewFallback");
                var mainEl = document.getElementById("previewSwiperMain");
                var thumbsEl = document.getElementById("previewSwiperThumbs");
                if (fallback) fallback.style.display = "none";
                if (mainEl) mainEl.style.display = "";
                if (thumbsEl) thumbsEl.style.display = "";
            }

            function initPreviewSwiper(images) {
                var mainEl = document.getElementById("previewSwiperMain");
                var thumbsEl = document.getElementById("previewSwiperThumbs");
                if (!mainEl || !thumbsEl) return;

                if (typeof Swiper === "undefined") {
                    showPreviewFallback(images);
                    return;
                }
                hidePreviewFallback();

                var hasThumbs = images && images.length > 0;

                if (hasThumbs) {
                    thumbsSwiper = new Swiper(thumbsEl, {
                        slidesPerView: "auto",
                        spaceBetween: 10,
                        centeredSlides: true,
                        slideToClickedSlide: true,
                        observer: true,
                        observeParents: true,
                    });
                }

                mainSwiper = new Swiper(mainEl, {
                    slidesPerView: 1,
                    loop: true,
                    loopAddBlankSlides: true,
                    navigation: {
                        nextEl: ".swiper-button-next",
                        prevEl: ".swiper-button-prev",
                    },
                    pagination: {
                        el: ".swiper-pagination",
                        clickable: true,
                    },
                    thumbs: hasThumbs ? {swiper: thumbsSwiper} : undefined,
                    observer: true,
                    observeParents: true,
                    keyboard: {enabled: true},
                });

                if (!hasThumbs) thumbsEl.style.display = "none";
            }

            function startThumbInspector() {
                var list = document.getElementById("editThumbs");
                if (!list || typeof MutationObserver === "undefined") return;
                var observer = new MutationObserver(function (mutations) {
                    mutations.forEach(function (m) {
                        if (m.type === "attributes" && (m.attributeName === "style" || m.attributeName === "class")) {
                            console.log(
                                "[ThumbMutation] " + m.attributeName +
                                " on <" + (m.target.tagName || "") + " class=" + (m.target.className || "") + "> value=" +
                                m.target.getAttribute(m.attributeName)
                            );
                        }
                    });
                });
                observer.observe(list, {
                    attributes: true,
                    subtree: true,
                    attributeFilter: ["style", "class"],
                });
            }

            function renderEditThumbs() {
                var list = document.getElementById("editThumbs");
                if (!list) return;
                list.innerHTML = "";

                if (pendingImages.length === 0) {
                    var empty = document.createElement("div");
                    empty.className = "edit-thumbs-empty";
                    empty.textContent = "暂无图片，点击上方上传";
                    list.appendChild(empty);
                    return;
                }

                pendingImages.forEach(function (src, index) {
                    var item = document.createElement("div");
                    item.className = "edit-thumb";

                    var img = document.createElement("img");
                    img.src = src;
                    img.alt = "图片 " + (index + 1);
                    img.addEventListener("load", function () {
                        hideSkeleton(item);
                    });
                    img.addEventListener("error", function () {
                        hideSkeleton(item);
                    });

                    var btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "edit-thumb-remove";
                    btn.textContent = "✕";
                    btn.setAttribute("aria-label", "移除图片 " + (index + 1));
                    btn.addEventListener("click", function () {
                        pendingImages.splice(index, 1);
                        renderEditThumbs();
                        scheduleAutosave();
                    });

                    item.appendChild(img);
                    item.appendChild(btn);
                    list.appendChild(item);
                });

                logThumbStyles("render");
            }

            function fillClassify(cloud) {
                Object.keys(PRESETS).forEach(function (key) {
                    var sel = document.getElementById("sel-" + key);
                    var custom = document.getElementById("custom-" + key);
                    if (!sel || !custom) return;
                    var value = cloud[key] || "";

                    if (isPreset(key, value)) {
                        sel.value = value;
                        custom.hidden = true;
                    } else if (value) {
                        sel.value = "__custom__";
                        custom.hidden = false;
                        custom.value = value;
                    } else {
                        sel.value = PRESETS[key][0];
                        custom.hidden = true;
                        custom.value = "";
                    }
                    var co = sel.options[sel.options.length - 1];
                    if (co) {
                        co.textContent = custom.hidden || !custom.value
                            ? "✏️ 自定义..."
                            : "✏️ 自定义: " + custom.value;
                    }
                });
            }

            function readEditValues() {
                var classify = readClassify();
                return {
                    name: document.getElementById("editName").value,
                    notes: document.getElementById("editDesc").value,
                    family: classify.family,
                    genus: classify.genus,
                    species: classify.species,
                    variety: classify.variant,
                    accessory: classify.accessory,
                    images: pendingImages.slice(),
                };
            }

            function editStateString() {
                return JSON.stringify(readEditValues());
            }

            function hasUnsavedChanges() {
                if (editSnapshot == null) return false;
                return editStateString() !== editSnapshot;
            }

            function showAutosaveToast() {
                var el = document.getElementById("autosaveToast");
                if (!el) return;
                el.classList.remove("hide");
                el.classList.add("show");
                clearTimeout(autosaveToastTimer);
                autosaveToastTimer = setTimeout(function () {
                    el.classList.remove("show");
                    el.classList.add("hide");
                }, 2000);
            }

            function scheduleAutosave() {
                clearTimeout(autosaveTimer);
                if (!hasUnsavedChanges()) return;
                autosaveTimer = setTimeout(doAutosave, 800);
            }

            async function doAutosave() {
                if (selectedId == null) return;
                if (!hasUnsavedChanges()) return;
                try {
                    var patch = readEditValues();
                    await CloudAPI.update(selectedId, patch);
                    editSnapshot = editStateString();
                    showAutosaveToast();
                } catch (e) {
                    console.error("自动保存失败", e);
                }
            }

            async function saveEdit() {
                if (!(await ensureAuth())) return;

                var nameInput = document.getElementById("editName");
                var name = nameInput ? nameInput.value.trim() : "";
                if (!name) {
                    window.alert("请输入云朵名称");
                    if (nameInput) nameInput.focus();
                    return;
                }

                var classify = readClassify();
                var cloudData = {
                    name: name,
                    notes: document.getElementById("editDesc").value,
                    family: classify.family,
                    genus: classify.genus,
                    species: classify.species,
                    variety: classify.variant,
                    accessory: classify.accessory,
                    images: Array.isArray(pendingImages) ? pendingImages.slice() : [],
                };
                console.log("保存数据:", cloudData);

                var result;
                if (selectedId == null) {
                    result = await CloudAPI.add(cloudData);
                    if (result) {
                        createdId = result.id;
                        selectedId = result.id;
                    }
                } else {
                    result = await CloudAPI.update(selectedId, cloudData);
                }

                if (result) {
                    console.log("[CloudAtlas] 保存完成", result);
                } else {
                    window.alert("保存失败，请检查控制台错误");
                    return;
                }

                createdId = null;
                await renderList();
                await closeEdit();

            function readClassify() {
                var out = {};
                Object.keys(PRESETS).forEach(function (key) {
                    var sel = document.getElementById("sel-" + key);
                    var custom = document.getElementById("custom-" + key);
                    var value;
                    if (sel && sel.value === "__custom__") {
                        value = (custom ? custom.value : "").trim();
                    } else {
                        value = sel ? sel.value : "";
                    }
                    out[key] = value;
                });
                return out;
            }

            function readFileText(file) {
                return new Promise(function (resolve, reject) {
                    var reader = new FileReader();
                    reader.onload = function (e) {
                        resolve(String(e.target.result));
                    };
                    reader.onerror = function () {
                        reject(reader.error || new Error("文件读取失败"));
                    };
                    reader.readAsText(file);
                });
            }

            function exportData() {
                return getAllClouds().then(function (clouds) {
                    var json = JSON.stringify(clouds, null, 2);
                    var blob = new Blob([json], {type: "application/json"});
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement("a");
                    a.href = url;
                    a.download = "cloudatlas-export-" + new Date().toISOString().slice(0, 10) + ".json";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });
            }

            function validateImportData(data) {
                if (!Array.isArray(data)) return "文件内容不是数组";
                if (data.length === 0) return "文件不包含任何云朵数据";
                for (var i = 0; i < data.length; i++) {
                    var c = data[i];
                    if (!c || typeof c !== "object") return "第 " + (i + 1) + " 条记录不是对象";
                    if (c.id == null) return "第 " + (i + 1) + " 条记录缺少 id";
                    if (typeof c.name !== "string") return "第 " + (i + 1) + " 条记录缺少 name";
                    if (!Array.isArray(c.images)) return "第 " + (i + 1) + " 条记录缺少 images 数组";
                }
                return null;
            }

            function showImportConfirm(data) {
                var desc = document.getElementById("importDesc");
                if (desc) desc.textContent = "检测到 " + data.length + " 朵云朵，请选择导入方式：";
                document.getElementById("importOverlay").hidden = false;
                document.body.classList.add("modal-open");
            }

            function closeImportConfirm() {
                document.getElementById("importOverlay").hidden = true;
                if (
                    document.getElementById("previewOverlay").hidden &&
                    document.getElementById("editOverlay").hidden
                ) {
                    document.body.classList.remove("modal-open");
                }
                pendingImport = null;
            }

            async function performImport(mode) {
                var overlay = document.getElementById("importOverlay");
                var data = normalize(pendingImport || []);
                overlay.hidden = true;
                if (
                    document.getElementById("previewOverlay").hidden &&
                    document.getElementById("editOverlay").hidden
                ) {
                    document.body.classList.remove("modal-open");
                }

                try {
                    if (mode === "overwrite") {
                        var existing = await getAllClouds();
                        await Promise.all(
                            existing.map(function (c) {
                                return CloudAPI.delete(c.id);
                            })
                        );
                        for (var i = 0; i < data.length; i++) {
                            await CloudAPI.add(data[i]);
                        }
                    } else {
                        var current = await getAllClouds();
                        var seen = {};
                        current.forEach(function (c) {
                            seen[String(c.id)] = true;
                        });
                        var toAdd = data.filter(function (c) {
                            if (seen[String(c.id)]) return false;
                            seen[String(c.id)] = true;
                            return true;
                        });
                        for (var j = 0; j < toAdd.length; j++) {
                            await CloudAPI.add(toAdd[j]);
                        }
                    }
                    showToast(mode === "overwrite" ? "覆盖导入完成" : "追加导入完成");
                } catch (err) {
                    console.error("导入失败", err);
                    window.alert("导入失败：" + err);
                }
                pendingImport = null;
                setTimeout(hideToast, 1500);
                await renderList();
            }

            function bindClassifyEvents() {
                var selects = document.querySelectorAll(".classify-item select[data-key]");
                selects.forEach(function (sel) {
                    sel.addEventListener("change", function () {
                        var key = sel.dataset.key;
                        var custom = document.getElementById("custom-" + key);
                        if (!custom) return;
                        var co = sel.options[sel.options.length - 1];

                        if (sel.value === "__custom__") {
                            custom.hidden = false;
                            custom.focus();
                            if (co) co.textContent = "✏️ 自定义...";
                        } else {
                            custom.hidden = true;
                            if (co) co.textContent = "✏️ 自定义...";
                        }
                        scheduleAutosave();
                    });
                });

                var customInputs = document.querySelectorAll(".custom-input");
                customInputs.forEach(function (inp) {
                    inp.addEventListener("input", function () {
                        var key = inp.dataset.key;
                        var sel = document.getElementById("sel-" + key);
                        if (!sel) return;
                        var co = sel.options[sel.options.length - 1];
                        if (!co) return;
                        co.textContent = inp.value
                            ? "✏️ 自定义: " + inp.value
                            : "✏️ 自定义...";
                        scheduleAutosave();
                    });
                });
            }

                    new Sortable(editThumbsList, {
                        animation: 150,
                        direction: "horizontal",
                        draggable: ".edit-thumb",
                        filter: ".edit-thumb-remove",
                        preventOnFilter: true,
                        onEnd: function () {
                            var imgs = editThumbsList.querySelectorAll(".edit-thumb img");
                            var reordered = [];
                            imgs.forEach(function (imgEl) {
                                var src = imgEl.getAttribute("src");
                                var idx = pendingImages.indexOf(src);
                                if (idx !== -1) reordered.push(pendingImages[idx]);
                            });
                            if (reordered.length === pendingImages.length) {
                                pendingImages = reordered;
                            }
                            scheduleAutosave();
                        },
                    });
                }

                startThumbInspector();

                if (btnAdd) {
                    btnAdd.addEventListener("click", async function () {
                        if (!(await ensureAuth())) return;
                        selectedId = null;
                        createdId = null;
                        var blankCloud = {
                            name: "",
                            notes: "",
                            family: "高云族",
                            genus: "",
                            species: "",

                if (editClose) editClose.addEventListener("click", function () {requestCloseEdit();});
                if (editOverlay) {
                    editOverlay.addEventListener("click", function (e) {
                        if (e.target === editOverlay) requestCloseEdit();
                    });
                }

                if (editSave) editSave.addEventListener("click", saveEdit);

                if (editDelete) {
                    editDelete.addEventListener("click", async function () {
                        if (selectedId == null) return;
                        if (!(await ensureAuth())) return;
                        await CloudAPI.delete(selectedId);
                        createdId = null;
                        await renderList();
                        await closeEdit();
                    });
                }

                if (editAI) {
                    editAI.addEventListener("click", async function () {
                        if (selectedId == null) return;
                        if (!(await ensureAuth())) return;
                        var fake = mockRecognize();
                        var patch = readClassify();
                        patch.name = document.getElementById("editName").value;
                        patch.notes = document.getElementById("editDesc").value;
                        patch.images = pendingImages.slice();
                        patch.family = fake.family;
                        patch.genus = fake.genus;
                        patch.species = fake.species;
                        patch.variety = fake.variant;
                        patch.accessory = fake.accessory;
                        await CloudAPI.update(selectedId, patch);
                        createdId = null;
                        await renderList();
                        await closeEdit();

                if (editMedia && editFile) {
                    function triggerUpload() {
                        editFile.click();
                    }
                    editMedia.addEventListener("click", triggerUpload);
                    editMedia.addEventListener("keydown", function (e) {
                        if (e.key === "Enter" || e.key === " ") {
                            e.preventDefault();
                            triggerUpload();
                        }
                    });

                    editFile.addEventListener("change", async function () {
                        var files = Array.prototype.slice.call(editFile.files || []);
                        if (!files.length) return;

                        var valid = files.filter(function (f) {
                            return f.type && f.type.indexOf("image/") === 0;
                        });
                        if (valid.length !== files.length) {
                            window.alert("已忽略非图片文件（image/*）");
                        }
                        if (valid.length === 0) {
                            editFile.value = "";
                            return;
                        }

                        var saved = [];
                        for (var i = 0; i < valid.length; i++) {
                            try {
                                var stored = await ImageStorage.save(valid[i]);
                                saved.push(stored);
                            } catch (err) {
                                console.warn("图片保存失败", err);
                            }
                        }
                        pendingImages = pendingImages.concat(saved);
                        renderEditThumbs();
                        editFile.value = "";
                        scheduleAutosave();
                    });
                }

                var btnExport = document.getElementById("btnExport");
                var btnImport = document.getElementById("btnImport");
                var importFile = document.getElementById("importFile");
                var importOverlay = document.getElementById("importOverlay");
                var importCancelX = document.getElementById("importCancelX");
                var importOverwrite = document.getElementById("importOverwrite");
                var importAppend = document.getElementById("importAppend");

                if (btnExport) {
                    btnExport.addEventListener("click", function () {
                        exportData().catch(function (err) {
                            console.error("导出失败", err);
                            window.alert("导出失败：" + err);
                        });
                    });
                }

                if (btnImport && importFile) {
                    btnImport.addEventListener("click", function () {
                        importFile.value = "";
                        importFile.click();
                    });

                    importFile.addEventListener("change", async function () {
                        var file = importFile.files && importFile.files[0];
                        if (!file) return;
                        try {
                            var text = await readFileText(file);
                            var data = JSON.parse(text);
                            var invalid = validateImportData(data);
                            if (invalid) {
                                window.alert("导入失败：" + invalid);
                                importFile.value = "";
                                return;
                            }
                            pendingImport = data;
                            showImportConfirm(data);
                        } catch (e) {
                            window.alert("导入失败：不是有效的 JSON 文件");
                            importFile.value = "";
                        }
                    });
                }

                if (importOverwrite) {
                    importOverwrite.addEventListener("click", function () {
                        performImport("overwrite");
                    });
                }
                if (importAppend) {
                    importAppend.addEventListener("click", function () {
                        performImport("append");
                    });
                }
                if (importCancelX) importCancelX.addEventListener("click", closeImportConfirm);
                if (importOverlay) {
                    importOverlay.addEventListener("click", function (e) {
                        if (e.target === importOverlay) closeImportConfirm();
                    });
                }

                document.addEventListener("keydown", function (e) {
                    if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) {
                        if (!editOverlay.hidden && pwOverlay.hidden && cpwOverlay.hidden) {
                            e.preventDefault();
                            saveEdit();
                        }
                        return;
                    }

                    if (e.key !== "Escape") return;
                    var ssEl = document.getElementById("slideshow");
                    if (ssEl && !ssEl.hidden) {
                        ssExit();
                        return;
                    }
                    if (!previewOverlay.hidden) closePreview();
                    else if (!editOverlay.hidden) requestCloseEdit();
                    else if (!pwOverlay.hidden) {
                        closePasswordModal();
                        if (authResolve) {
                            var r = authResolve;
                            authResolve = null;
                            r(false);
                        }
                    } else if (!cpwOverlay.hidden) closeChangePwModal();
                    else if (importOverlay && !importOverlay.hidden) closeImportConfirm();
                });
            }

            function mockRecognize() {
                function pick(arr) {
                    return arr[Math.floor(Math.random() * arr.length)];
                }
                return {
                    family: pick(PRESETS.family),
                    genus: pick(PRESETS.genus),
                    species: pick(PRESETS.species),
                    variant: pick(PRESETS.variant),
                    accessory: pick(PRESETS.accessory),
                };
            }

            // ==============================================================
            // 17. 主题与幻灯片
            // ==============================================================
            var THEME_KEY = "cloudatlas.theme";

            function applySiteLogo(theme) {
                var img = document.getElementById("siteLogo");
                if (!img) return;
                var target = theme === "dark"
                    ? img.getAttribute("data-dark")
                    : img.getAttribute("data-light");
                if (target) img.src = target;
            }

            function setupSiteLogo() {
                var img = document.getElementById("siteLogo");
                var fb = document.getElementById("siteLogoFallback");
                if (!img) return;
                img.addEventListener("error", function () {
                    img.style.display = "none";
                    if (fb) fb.hidden = false;
                });
                if (img.complete && img.naturalWidth === 0) {
                    img.style.display = "none";
                    if (fb) fb.hidden = false;
                }
            }

            function applyTheme(theme) {
                document.documentElement.setAttribute("data-theme", theme);
                applySiteLogo(theme);
                var btn = document.getElementById("btnTheme");
                if (btn) btn.textContent = theme === "dark" ? "🌙" : "☀️";
            }

            function initTheme() {
                var saved = localStorage.getItem(THEME_KEY);
                applyTheme(saved === "dark" ? "dark" : "light");
            }

            function toggleTheme() {
                var current =
                    document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
                var next = current === "dark" ? "light" : "dark";
                try {
                    localStorage.setItem(THEME_KEY, next);
                } catch (e) {
                    console.warn("主题存储失败", e);
                }
                applyTheme(next);
            }

            const BGM_URL = "https://others.ycxazzo.top/bgm/bgm.mp3";
            const bgmAudio = new Audio(BGM_URL);
            bgmAudio.loop = true;
            var ssTimer = null;
            var ssHideTimer = null;
            var bgmAutoTimer = null;
            var bgmTipTimer = null;
            var ssPlaylist = [];
            var ssIndex = 0;
            var ssPlaying = true;

            function shuffle(arr) {
                for (var i = arr.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var t = arr[i];
                    arr[i] = arr[j];
                    arr[j] = t;
                }
                return arr;
            }

            function playSlideshow() {
                return getAllClouds().then(function (clouds) {
                    var items = [];
                    clouds.forEach(function (c) {
                        (c.images || []).forEach(function (src) {
                            items.push({src: src, name: c.name || "未命名"});
                        });
                    });
                    if (items.length < 1) {
                        window.alert("至少需要 1 张图片才能进入幻灯片模式，当前只有 " + items.length + " 张。");
                        return;
                    }
                    ssPlaylist = shuffle(items);
                    ssIndex = 0;
                    ssPlaying = true;

                    var el = document.getElementById("slideshow");
                    if (!el) return;
                    document.getElementById("slideStage").innerHTML = "";
                    el.hidden = false;
                    requestAnimationFrame(function () {
                        el.classList.add("show");
                    });
                    if (el.requestFullscreen) {
                        el.requestFullscreen().catch(function () { });
                    }
                    document.body.classList.add("modal-open");
                    ssRender();
                    ssResume();

                    startBgmSequence();
                });
            }

            function updateMusicIcon() {
                var btn = document.getElementById("ssMusic");
                if (!btn) return;
                var playing = bgmAudio && !bgmAudio.paused;
                btn.textContent = playing ? "🔇" : "🔊";
                btn.title = playing ? "停止音乐" : "播放音乐";
            }

            function startBgmSequence() {
                var tip = document.getElementById("ssMusicTip");
                if (bgmTipTimer) clearTimeout(bgmTipTimer);
                if (bgmAutoTimer) clearTimeout(bgmAutoTimer);

                if (tip) {
                    tip.classList.add("show");
                    bgmTipTimer = setTimeout(function () {
                        tip.classList.remove("show");
                    }, 3000);
                }

                bgmAutoTimer = setTimeout(function () {
                    if (bgmAudio && bgmAudio.paused) {
                        bgmAudio.play().then(updateMusicIcon).catch(function (e) {
                            console.warn("BGM 自动播放失败", e);
                            updateMusicIcon();
                        });
                    }
                    updateMusicIcon();
                }, 3000);
            }

            function ssRender() {
                var stage = document.getElementById("slideStage");
                var nameEl = document.getElementById("slideName");
                var progress = document.getElementById("ssProgress");
                if (!stage) return;
                var old = stage.querySelector(".slide-img");
                var img = document.createElement("img");
                img.className = "slide-img";
                img.src = ssPlaylist[ssIndex].src;
                img.alt = ssPlaylist[ssIndex].name;
                stage.appendChild(img);
                requestAnimationFrame(function () {
                    if (old && old.classList) old.classList.remove("active");
                    img.classList.add("active");
                    setTimeout(function () {
                        if (old && old.parentNode) old.parentNode.removeChild(old);
                    }, 850);
                });
                if (nameEl) nameEl.textContent = ssPlaylist[ssIndex].name;
                if (progress) progress.textContent = ssIndex + 1 + " / " + ssPlaylist.length;
            }

            function ssGoNext() {
                if (!ssPlaylist.length) return;
                ssIndex = (ssIndex + 1) % ssPlaylist.length;
                ssRender();
                ssShowControls();
                if (ssPlaying) ssSchedule();
            }

            function ssGoPrev() {
                if (!ssPlaylist.length) return;
                ssIndex = (ssIndex - 1 + ssPlaylist.length) % ssPlaylist.length;
                ssRender();
                ssShowControls();
                if (ssPlaying) ssSchedule();
            }

            function ssSchedule() {
                if (ssTimer) clearInterval(ssTimer);
                ssTimer = setInterval(ssGoNext, 5000);
            }

            function ssResume() {
                ssPlaying = true;
                ssSchedule();
            }

            function ssPause() {
                ssPlaying = false;
                if (ssTimer) {
                    clearInterval(ssTimer);
                    ssTimer = null;
                }
            }

            function ssTogglePlay() {
                if (ssPlaying) ssPause();
                else ssResume();
                ssShowControls();
            }

            function ssShowControls() {
                var c = document.getElementById("ssControls");
                if (c) c.classList.add("show");
                if (ssHideTimer) clearTimeout(ssHideTimer);
                ssHideTimer = setTimeout(ssHideControls, 3000);
            }

            function ssHideControls() {
                var c = document.getElementById("ssControls");
                if (c) c.classList.remove("show");
            }

            function toggleMusic() {
                if (!bgmAudio) return;
                if (bgmAudio.paused) {
                    bgmAudio.play().then(updateMusicIcon).catch(function (e) {
                        console.warn("BGM 播放失败", e);
                        updateMusicIcon();
                    });
                } else {
                    bgmAudio.pause();
                    updateMusicIcon();
                }
            }

            function ssExit() {
                if (ssTimer) clearInterval(ssTimer);
                ssTimer = null;
                if (ssHideTimer) clearTimeout(ssHideTimer);
                if (bgmAutoTimer) clearTimeout(bgmAutoTimer);
                bgmAutoTimer = null;
                if (bgmTipTimer) clearTimeout(bgmTipTimer);
                bgmTipTimer = null;
                if (bgmAudio && !bgmAudio.paused) {
                    bgmAudio.pause();
                }
                updateMusicIcon();
                if (document.fullscreenElement && document.exitFullscreen) {
                    document.exitFullscreen().catch(function () { });
                }
                var el = document.getElementById("slideshow");
                if (el) {
                    el.classList.remove("show");
                    setTimeout(function () {
                        el.hidden = true;
                    }, 600);
                }
                document.body.classList.remove("modal-open");
                ssPlaylist = [];
            }

            function ssBindEvents() {
                var el = document.getElementById("slideshow");
                var btn = document.getElementById("btnSlideshow");
                var themeBtn = document.getElementById("btnTheme");

                if (themeBtn) themeBtn.addEventListener("click", toggleTheme);
                if (btn) btn.addEventListener("click", function () {
                    playSlideshow();
                });

                if (el) {
                    el.addEventListener("click", function (e) {
                        if (e.target.closest(".ss-controls")) return;
                        ssShowControls();
                        var w = window.innerWidth;
                        var x = e.clientX;
                        if (x < w * 0.3) ssGoPrev();
                        else if (x > w * 0.7) ssGoNext();
                        else ssTogglePlay();
                    });
                    el.addEventListener("mousemove", function () {
                        ssShowControls();
                    });
                }

                var ssBtnPrev = document.getElementById("ssPrev");
                var ssBtnNext = document.getElementById("ssNext");
                var ssBtnExit = document.getElementById("ssExit");
                var ssBtnMusic = document.getElementById("ssMusic");
                if (ssBtnPrev) ssBtnPrev.addEventListener("click", function (e) {e.stopPropagation(); ssGoPrev();});
                if (ssBtnNext) ssBtnNext.addEventListener("click", function (e) {e.stopPropagation(); ssGoNext();});
                if (ssBtnExit) ssBtnExit.addEventListener("click", function (e) {e.stopPropagation(); ssExit();});
                if (ssBtnMusic) ssBtnMusic.addEventListener("click", function (e) {e.stopPropagation(); toggleMusic();});
            }

            // ==============================================================
            // 认证辅助函数
            // ==============================================================
            function ensureAuth() {
                if (isAuthed()) return Promise.resolve(true);
                return new Promise(function (resolve) {
                    authResolve = resolve;
                    openPasswordModal();
                });
            }
            // ==============================================================
            // 18. 初始化
            // ==============================================================
            async function init() {
                initTheme();  // 修正拼写
                setupSiteLogo();
                showToast("正在加载数据...");

                // 先确保用户已认证
                var authed = await ensureAuth();
                if (!authed) {
                    hideToast();
                    return;
                }

                renderList()
                    .then(function () {
                        bindEvents();
                        ssBindEvents();
                        setTimeout(hideToast, 1200);
                    })
                    .catch(function (err) {
                        console.error("CloudAtlas 初始化失败", err);
                        hideToast();
                    });
            }
            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", function () {
                    init();
                });
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
